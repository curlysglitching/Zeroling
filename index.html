    modal(`
      <h3>${c ? 'Edit card' : 'Add a card'}</h3>
      <p class="sheetsub">${c ? 'Correcting a balance adjusts your starting total too, so it can\'t fake progress.'
                              : 'Only the name and balance are required.'}</p>
      ${cardFormHTML(c)}
      <div class="actions">
        <button class="btn" data-act="close">Cancel</button>
        <button class="btn primary" data-act="${c ? 'save-card' : 'create-card'}" data-id="${id || ''}">
          ${c ? 'Save' : 'Add card'}</button>
      </div>`, sheet => sheet.querySelector('#f-name').focus());
  }

  function cardMenuModal(id) {
    const c = Game.s().cards.find(x => x.id === id);
    if (!c) return;
    modal(`
      <h3>${esc(c.name)}</h3>
      <p class="sheetsub">${money(c.balance)} · ${c.apr ? c.apr + '% APR' : 'no rate set'}</p>
      <button class="btn wide" data-act="log-month" data-id="${id}" style="margin-bottom:9px">Log a month</button>
      <button class="btn wide" data-act="edit-card" data-id="${id}" style="margin-bottom:9px">Edit details</button>
      <button class="btn wide danger" data-act="del-card" data-id="${id}">Remove card</button>
      <div class="actions"><button class="btn wide" data-act="close">Cancel</button></div>`);
  }

  let logState = { cardId: null, tag: 'impulse' };

  function logMonthModal(id) {
    const st = Game.s();
    const pending = Game.pendingThisPeriod();
    const card = st.cards.find(c => c.id === id) || pending[0] || st.cards[0];
    if (!card) { toast('Add a card first.'); return; }
    logState = { cardId: card.id, tag: 'impulse' };

    modal(`
      <h3>Log ${esc(Finance.periodLabel(Finance.periodKey()))}</h3>
      <p class="sheetsub">What happened on this card since last month.</p>
      <label class="f"><span>Card</span>
        <select id="l-card">${st.cards.map(c =>
          `<option value="${c.id}" ${c.id === card.id ? 'selected' : ''}>${esc(c.name)} — ${money(c.balance)}</option>`).join('')}</select>
      </label>
      <div class="grid2">
        <label class="f"><span>New charges</span>
          <input type="number" id="l-charges" inputmode="decimal" min="0" step="0.01" placeholder="0.00" value=""></label>
        <label class="f"><span>Payment made</span>
          <input type="number" id="l-payment" inputmode="decimal" min="0" step="0.01" placeholder="0.00" value=""></label>
      </div>
      <label class="f"><span>Interest charged <em>optional — leave blank to estimate</em></span>
        <input type="number" id="l-interest" inputmode="decimal" min="0" step="0.01" placeholder="" value=""></label>
      <div id="l-tagwrap">
        <span style="display:block;font-size:12px;color:var(--dim);margin-bottom:6px;font-weight:600">
          What were the charges for?</span>
        <div class="tagpick">
          ${Data.TAGS.map(t => `<button data-act="tag" data-id="${t.id}" class="${t.id === 'impulse' ? 'on' : ''}">
            ${t.icon} ${esc(t.label)}<span class="t">${esc(t.desc)}</span></button>`).join('')}
        </div>
      </div>
      <div class="card tight" id="l-preview" style="margin:13px 0 0"></div>
      <div class="actions">
        <button class="btn" data-act="close">Cancel</button>
        <button class="btn primary" data-act="commit-log">Log it</button>
      </div>`, sheet => {
      const upd = () => updateLogPreview(sheet);
      ['l-card', 'l-charges', 'l-payment', 'l-interest'].forEach(idd => {
        const e = sheet.querySelector('#' + idd);
        e.addEventListener('input', upd);
        e.addEventListener('change', upd);
      });
      upd();
    });
  }

  function readLog(sheet) {
    const st = Game.s();
    const cardId = sheet.querySelector('#l-card').value;
    const card = st.cards.find(c => c.id === cardId);
    const charges = parseFloat(sheet.querySelector('#l-charges').value) || 0;
    const payment = parseFloat(sheet.querySelector('#l-payment').value) || 0;
    const raw = sheet.querySelector('#l-interest').value;
    const interest = raw === '' ? null : (parseFloat(raw) || 0);
    return { card, charges, payment, interest };
  }

  function updateLogPreview(sheet) {
    const { card, charges, payment, interest } = readLog(sheet);
    if (!card) return;
    const int = interest == null ? Finance.estInterest(card.balance, card.apr) : interest;
    const after = Math.max(0, card.balance + charges + int - payment);
    const net = after - card.balance;
    const box = sheet.querySelector('#l-preview');
    const tagwrap = sheet.querySelector('#l-tagwrap');
    tagwrap.style.display = charges > 0 ? '' : 'none';

    box.innerHTML = `
      <div class="row small"><span class="muted">Starting balance</span><div class="spacer"></div><b>${money(card.balance, true)}</b></div>
      ${charges ? `<div class="row small"><span class="muted">+ new charges</span><div class="spacer"></div><b style="color:var(--bad)">${money(charges, true)}</b></div>` : ''}
      <div class="row small"><span class="muted">+ interest${interest == null ? ' (est.)' : ''}</span><div class="spacer"></div><b style="color:var(--warn)">${money(int, true)}</b></div>
      ${payment ? `<div class="row small"><span class="muted">− payment</span><div class="spacer"></div><b style="color:var(--good)">${money(payment, true)}</b></div>` : ''}
      <div class="hr" style="margin:9px -11px"></div>
      <div class="row"><b>New balance</b><div class="spacer"></div><b style="font-size:17px">${money(after, true)}</b></div>
      <div class="row small" style="margin-top:4px">
        <span style="color:${net < 0 ? 'var(--good)' : net > 0 ? 'var(--bad)' : 'var(--dim)'}">
          ${net < 0 ? `▼ down ${money(-net, true)} — ${esc(Game.s().pet.name)} grows`
            : net > 0 ? `▲ up ${money(net, true)} — ${esc(Game.s().pet.name)} takes a hit`
            : 'no change'}</span>
      </div>
      ${after <= 0.005 && card.balance > 0.005 ? `<div class="small" style="color:var(--good);margin-top:7px">🎉 This clears the card.</div>` : ''}`;
  }

  function tipsModal() {
    const st = Game.s();
    const cats = [...new Set(Data.TIPS.map(t => t.cat))];
    modal(`
      <h3>Money tips</h3>
      <p class="sheetsub">${st.tips.seen.length} of ${Data.TIPS.length} read. Tap one to open it.</p>
      ${cats.map(cat => `
        <h2 class="sec">${esc(cat)}</h2>
        ${Data.TIPS.filter(t => t.cat === cat).map(t => `
          <div class="item clickable" data-act="tip-open" data-id="${t.id}">
            <div class="ico">${st.tips.seen.includes(t.id) ? '✅' : '💡'}</div>
            <div class="body"><b>${esc(t.title)}</b></div>
          </div>`).join('')}`).join('')}
      <div class="actions"><button class="btn wide" data-act="close">Close</button></div>`);
  }

  function tipModal(id) {
    const t = Data.TIPS.find(x => x.id === id);
    if (!t) return;
    Game.markTipSeen(id);
    modal(`
      <div class="cat" style="font-size:10.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--info);font-weight:800">${esc(t.cat)}</div>
      <h3>${esc(t.title)}</h3>
      <p style="font-size:14px;line-height:1.6;color:#c3d0de">${esc(t.body)}</p>
      <div class="actions">
        <button class="btn" data-act="tip-more">All tips</button>
        <button class="btn primary" data-act="close">Got it</button></div>`);
  }

  function settingsModal() {
    const st = Game.s();
    modal(`
      <h3>Settings</h3>
      <p class="sheetsub">Zeroling stores everything on this device only.</p>
      <div class="item"><div class="ico">🎬</div>
        <div class="body"><b>Reduce motion</b><div class="sub">Draw the pet as a still image.</div></div>
        <button class="btn sm ${st.settings.reduceMotion ? 'primary' : ''}" data-act="toggle-motion">
          ${st.settings.reduceMotion ? 'On' : 'Off'}</button></div>
      <div class="item clickable" data-act="ics-month"><div class="ico">🗓️</div>
        <div class="body"><b>Monthly log reminder</b><div class="sub">Adds a repeating calendar event on the 2nd.</div></div></div>
      <div class="item clickable" data-act="ics-daily"><div class="ico">⏰</div>
        <div class="body"><b>Daily check-in reminder</b><div class="sub">A repeating 7pm nudge to keep your streak.</div></div></div>
      <div class="item"><div class="ico">📱</div>
        <div class="body"><b>Add to your home screen</b>
          <div class="sub">Browser menu → "Install" or "Add to Home Screen". Far and away the best way to remember.</div></div></div>
      <div class="item clickable" data-act="export"><div class="ico">📤</div>
        <div class="body"><b>Export your data</b><div class="sub">Downloads a JSON backup.</div></div></div>
      <div class="item clickable" data-act="import"><div class="ico">📥</div>
        <div class="body"><b>Import a backup</b><div class="sub">Replaces everything currently saved.</div></div></div>
      <div class="item clickable" data-act="reset"><div class="ico">⚠️</div>
        <div class="body"><b style="color:var(--bad)">Start over</b><div class="sub">Erases your pet, cards and history.</div></div></div>
      <div class="actions"><button class="btn wide" data-act="close">Done</button></div>`);
  }

  /* ---------------- render ---------------- */
  function render() {
    const st = Game.s();
    cancelAnimationFrame(rafId);
    renderTop(); renderTabs();
    const scr = $('#screen');
    if (!st.onboarded) { renderOnboarding(); return; }
    scr.style.padding = '';
    scr.innerHTML =
      tab === 'pet' ? screenPet() :
      tab === 'debt' ? screenDebt() :
      tab === 'plan' ? screenPlan() :
      tab === 'shop' ? screenShop() : screenStats();

    if (tab === 'pet') startPetLoop();
    if (tab === 'stats') { const c = $('#histchart'); if (c) requestAnimationFrame(() => drawChart(c)); }
    if (tab === 'plan') {
      const sl = $('#extra-slider');
      if (sl) {
        sl.addEventListener('input', () => {
          planExtra = +sl.value;
          $('#extra-val').textContent = '+' + money(planExtra);
          $('#plan-results').innerHTML = planResults();     // slider element survives the update
        });
        sl.addEventListener('change', () => {              // persist once the drag ends
          Game.s().settings.extra = planExtra;
          State.save();
        });
      }
    }
    scr.scrollTop = 0;
  }

  function go(t) { tab = t; render(); }

  return { render, go, toast, modal, closeModal, addCardModal, cardMenuModal, logMonthModal,
           tipsModal, tipModal, settingsModal, readCardForm, readLog, step, esc,
           get obStep() { return obStep; }, set obPick(v) { obPick = v; }, get obPick() { return obPick; },
           get obName() { return obName; }, set obName(v) { obName = v; },
           get logState() { return logState; }, set logState(v) { logState = v; },
           get tab() { return tab; } };
})();


/* ===== js/main.js ===== */
/* Zeroling — bootstrap and event wiring. */
(() => {
  Game.init();
  const boot = Game.s().onboarded ? Game.checkIn() : null;
  UI.render();

  const $ = s => document.querySelector(s);
  const closest = (el, sel) => el && el.closest ? el.closest(sel) : null;

  function download(filename, text, mime) {
    const blob = new Blob([text], { type: mime });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }

  /* A repeating calendar entry is the only reminder a page like this can set that still
     fires when the app is closed — no server, no push, works on every phone. */
  function icsFile(kind) {
    const pad = n => String(n).padStart(2, '0');
    const z = d => d.getUTCFullYear() + pad(d.getUTCMonth() + 1) + pad(d.getUTCDate())
      + 'T' + pad(d.getUTCHours()) + pad(d.getUTCMinutes()) + '00Z';
    const now = new Date();
    const monthly = kind === 'month';
    const start = monthly
      ? new Date(now.getFullYear(), now.getMonth() + 1, 2, 19, 0, 0)
      : new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 19, 0, 0);
    const summary = monthly ? 'Log this month in Zeroling' : 'Zeroling check-in';
    return [
      'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Zeroling//Reminders//EN',
      'CALSCALE:GREGORIAN', 'METHOD:PUBLISH', 'BEGIN:VEVENT',
      'UID:zeroling-' + kind + '-' + now.getTime() + '@zeroling.local',
      'DTSTAMP:' + z(now), 'DTSTART:' + z(start),
      'DTEND:' + z(new Date(start.getTime() + 15 * 60000)),
      'RRULE:' + (monthly ? 'FREQ=MONTHLY;BYMONTHDAY=2' : 'FREQ=DAILY'),
      'SUMMARY:' + summary,
      'DESCRIPTION:' + (monthly
        ? 'Open Zeroling and log what you charged and paid on each card.'
        : 'Keep your streak going: daily tasks and a quick look at your pet.'),
      'BEGIN:VALARM', 'TRIGGER:-PT5M', 'ACTION:DISPLAY',
      'DESCRIPTION:' + summary, 'END:VALARM', 'END:VEVENT', 'END:VCALENDAR',
    ].join('\r\n');
  }

  /* Takes plain text, never markup — card names reach this and are user-controlled. */
  function confirmSheet(title, body, actionLabel, act) {
    UI.modal(`
      <h3>${UI.esc(title)}</h3>
      <p class="sheetsub">${UI.esc(body)}</p>
      <div class="actions">
        <button class="btn" data-act="close">Cancel</button>
        <button class="btn danger" data-act="${UI.esc(act)}">${UI.esc(actionLabel)}</button>
      </div>`);
  }

  /* Show achievement unlocks one after another so they don't stack on top of each other. */
  function celebrate(unlocked) {
    (unlocked || []).forEach((a, i) => {
      setTimeout(() => UI.toast(`${a.icon} ${a.name} — +${a.coins} 🪙`, 'coin'), 700 + i * 900);
    });
  }

  document.addEventListener('click', e => {
    const tabBtn = closest(e.target, '[data-tab]');
    if (tabBtn) { UI.go(tabBtn.dataset.tab); return; }

    const node = closest(e.target, '[data-act]');
    if (!node) return;
    const act = node.dataset.act;
    const id = node.dataset.id;
    const sheet = $('.sheet');

    switch (act) {
      /* ---- onboarding ---- */
      case 'ob-pick':
        UI.obPick = id; UI.render(); break;

      case 'ob-next': {
        if (UI.obStep === 1 && !UI.obPick) return;
        if (UI.obStep === 2) {
          const inp = $('#ob-name');
          UI.obName = (inp ? inp.value : '').trim();
        }
        UI.step(1);
        break;
      }

      case 'ob-addcard': {
        const data = UI.readCardForm();
        if (data.err) { UI.toast(data.err, 'bad'); return; }
        Game.addCard(data);
        UI.render();
        UI.toast(`Added ${data.name}.`);
        break;
      }

      case 'ob-finish': {
        const sp = Data.SPECIES_BY_ID[UI.obPick] || Data.SPECIES[0];
        Game.startGame(sp.id, UI.obName || sp.name);
        Game.checkIn();
        UI.go('pet');
        UI.toast(`${Game.s().pet.name} is counting on you.`);
        break;
      }

      /* ---- modal plumbing ---- */
      case 'modal-bg': if (e.target === node) UI.closeModal(); break;
      case 'close': UI.closeModal(); break;
      case 'settings': UI.settingsModal(); break;

      /* ---- pet ---- */
      case 'care': {
        const r = Game.doCare(id);
        if (!r) return;
        UI.render();
        UI.toast(`${r.care.icon} ${r.care.label}! ${r.coins ? `+${r.coins} 🪙` : ''}`, 'coin');
        if (r.recovered) setTimeout(() => UI.toast(`💚 ${Game.s().pet.name} is feeling better.`, 'coin'), 900);
        break;
      }

      case 'task': {
        if (Game.taskDone(id)) return;
        const r = Game.completeTask(id);
        if (!r) return;
        UI.render();
        UI.toast(`✓ ${r.task.label} — +${r.coins} 🪙`, 'coin');
        if (r.perfect) setTimeout(() => UI.toast('🌟 All three tasks done today!', 'coin'), 900);
        if (r.recovered) setTimeout(() => UI.toast(`💚 ${Game.s().pet.name} is feeling better.`, 'coin'), 1400);
        celebrate(r.unlocked);
        break;
      }

      case 'tip-more': UI.tipsModal(); break;
      case 'tip-open': UI.tipModal(id); break;

      /* ---- cards ---- */
      case 'add-card': UI.addCardModal(); break;
      case 'edit-card': UI.addCardModal(id); break;
      case 'card-menu': UI.cardMenuModal(id); break;

      case 'create-card': {
        const data = UI.readCardForm();
        if (data.err) { UI.toast(data.err, 'bad'); return; }
        Game.addCard(data);
        UI.closeModal(); UI.render();
        UI.toast(`Added ${data.name}.`);
        break;
      }

      case 'save-card': {
        const data = UI.readCardForm();
        if (data.err) { UI.toast(data.err, 'bad'); return; }
        Game.editCard(id, data);
        UI.closeModal(); UI.render();
        UI.toast('Saved.');
        break;
      }

      case 'del-card': {
        const c = Game.s().cards.find(x => x.id === id);
        confirmSheet('Remove this card?',
          `${c ? c.name : 'This card'} and its logged history will be deleted. Your starting total adjusts to match.`,
          'Remove', 'del-card-confirm');
        $('.sheet [data-act="del-card-confirm"]').dataset.id = id;
        break;
      }

      case 'del-card-confirm':
        Game.removeCard(id);
        UI.closeModal(); UI.render();
        UI.toast('Card removed.');
        break;

      /* ---- logging a month ---- */
      case 'log-month': UI.logMonthModal(id); break;

      case 'tag': {
        UI.logState = Object.assign({}, UI.logState, { tag: id });
        sheet.querySelectorAll('.tagpick button').forEach(b => b.classList.toggle('on', b.dataset.id === id));
        break;
      }

      case 'commit-log': {
        const { card, charges, payment, interest } = UI.readLog(sheet);
        if (!card) return;
        if (charges <= 0 && payment <= 0 && interest == null) {
          UI.toast('Enter a payment or some charges.', 'bad'); return;
        }
        const r = Game.logMonth(card.id, { charges, payment, interest, tag: UI.logState.tag });
        UI.closeModal(); UI.render();
        if (!r) return;
        if (r.net < 0) UI.toast(`📉 Down ${Finance.money(-r.net)} — +${r.coins} 🪙`, 'coin');
        else if (r.net > 0) UI.toast(`📈 Up ${Finance.money(r.net)}. ${Game.s().pet.name} felt that.`, 'bad');
        else UI.toast('Logged — balance unchanged.');
        if (r.cleared) setTimeout(() => UI.toast(`🎉 ${r.card.name} is paid off!`, 'coin'), 900);
        if (r.becameSick) setTimeout(() => UI.toast(`🤒 ${Game.s().pet.name} is unwell.`, 'bad'), 1400);
        if (r.recovered) setTimeout(() => UI.toast(`💚 ${Game.s().pet.name} is feeling better.`, 'coin'), 1400);
        celebrate(r.unlocked);
        break;
      }

      /* ---- plan ---- */
      case 'strategy':
        Game.s().strategy = id; State.save(); UI.render();
        break;

      /* ---- shop ---- */
      case 'shop': {
        const item = Data.SHOP_BY_ID[id];
        if (!item) return;
        if (Game.locked(item)) {
          const req = Data.ACHIEVEMENTS.find(a => a.id === item.req);
          UI.toast(req ? `🔒 ${req.desc}` : "🔒 Still locked.", "bad"); return;
        }
        if (Game.owned(id)) { Game.equip(id); UI.render(); return; }
        if (Game.s().coins < item.cost) { UI.toast('Not enough coins yet.', 'bad'); return; }
        const r = Game.buy(id);
        UI.render();
        if (r) { UI.toast(`${item.name} unlocked!`, 'coin'); celebrate(r.unlocked); }
        break;
      }

      /* ---- settings ---- */
      case 'toggle-motion': {
        const st = Game.s();
        st.settings.reduceMotion = !st.settings.reduceMotion;
        State.save(); UI.settingsModal(); UI.render();
        break;
      }

      case 'export':
        download(`zeroling-backup-${Game.dayKey()}.json`, State.exportJSON(), 'application/json');
        UI.toast('Backup downloaded.');
        break;

      case 'ics-month':
        download('zeroling-monthly-reminder.ics', icsFile('month'), 'text/calendar');
        UI.toast('Open the file to add it to your calendar.');
        break;

      case 'ics-daily':
        download('zeroling-daily-reminder.ics', icsFile('daily'), 'text/calendar');
        UI.toast('Open the file to add it to your calendar.');
        break;

      case 'import': {
        const inp = document.createElement('input');
        inp.type = 'file'; inp.accept = 'application/json,.json';
        inp.onchange = () => {
          const f = inp.files && inp.files[0];
          if (!f) return;
          const rd = new FileReader();
          rd.onload = () => {
            try {
              State.importJSON(rd.result);
              Game.init(); UI.closeModal(); UI.render();
              UI.toast('Backup restored.');
            } catch (err) {
              UI.toast(err && err.message ? err.message : 'That file is not a Zeroling backup.', 'bad');
            }
          };
          rd.readAsText(f);
        };
        inp.click();
        break;
      }

      case 'reset':
        confirmSheet('Start over?',
          'Your pet, cards, history and achievements will all be erased. Export a backup first if you might want them.',
          'Erase everything', 'reset-confirm');
        break;

      case 'reset-confirm':
        State.reset(); Game.init();
        UI.closeModal(); UI.go('pet'); UI.render();
        break;
    }
  });

  /* Vitals drift in real time; refresh the pet screen quietly while it's open. */
  setInterval(() => {
    if (Game.tick() && UI.tab === 'pet' && !document.querySelector('.sheet')) UI.render();
  }, 60e3);

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) return;
    Game.tick();
    if (!document.querySelector('.sheet')) UI.render();
  });

  /* Greet the returning player after the first paint so it reads as a reward, not a splash. */
  if (boot) {
    setTimeout(() => {
      if (boot.first) UI.toast(`Welcome — +${boot.coins} 🪙`, 'coin');
      else if (boot.broke && boot.daysAway > 1) {
        UI.toast(`Back after ${boot.daysAway} days — streak restarted. +${boot.coins} 🪙`, 'coin');
      } else UI.toast(`🔥 ${boot.streak}-day streak — +${boot.coins} 🪙`, 'coin');
      celebrate(boot.unlocked);
    }, 450);
  }

  window.addEventListener('beforeunload', () => State.save());

  /* Storage can fail: quota exhausted, private browsing, storage disabled entirely.
     Losing a year of payoff history without ever being told would be the worst outcome here. */
  window.addEventListener('zeroling:savefailed', () => {
    UI.toast('⚠️ Could not save — your browser is blocking storage.', 'bad');
    setTimeout(() => UI.toast('Export a backup from Settings before closing.', 'bad'), 2900);
  });
})();

</script>
