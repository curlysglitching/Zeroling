    { id: 'b-summit',  slot: 'bg',   name: 'Mountain summit', cost: 1800, c: '#9db8d2', req: 'debt-free' },
  ];

  /* Charge tags — "life happens" scaling on the punishment. */
  const TAGS = [
    { id: 'emergency', label: 'Emergency',  icon: '🚑', mult: 0.25,
      desc: 'Medical, car repair, urgent travel. Barely counts against you.' },
    { id: 'necessary', label: 'Necessary',  icon: '🧾', mult: 0.60,
      desc: 'Groceries, bills, something you genuinely needed.' },
    { id: 'planned',   label: 'Planned',    icon: '📅', mult: 0.75,
      desc: 'A deliberate charge you decided on in advance.' },
    { id: 'impulse',   label: 'Impulse',    icon: '🛍️', mult: 1.00,
      desc: 'Be honest. This is the one the game actually cares about.' },
  ];

  const SPECIES_BY_ID = Object.fromEntries(SPECIES.map(s => [s.id, s]));
  const SHOP_BY_ID    = Object.fromEntries(SHOP.map(s => [s.id, s]));
  const TAG_BY_ID     = Object.fromEntries(TAGS.map(t => [t.id, t]));
  const TASK_BY_ID    = Object.fromEntries(TASKS.map(t => [t.id, t]));

  function stageFor(pct) {
    let out = STAGES[0];
    for (const s of STAGES) if (pct >= s.min) out = s;
    return out;
  }

  /* Deterministic daily pick so tasks don't reroll on refresh. */
  function tasksFor(dateKey) {
    let h = 0;
    for (let i = 0; i < dateKey.length; i++) h = (h * 31 + dateKey.charCodeAt(i)) >>> 0;
    const pool = TASKS.slice();
    const out = [];
    for (let i = 0; i < 3 && pool.length; i++) {
      h = (h * 1664525 + 1013904223) >>> 0;
      out.push(pool.splice(h % pool.length, 1)[0]);
    }
    return out;
  }

  function tipFor(dateKey, seen = []) {
    const fresh = TIPS.filter(t => !seen.includes(t.id));
    const pool = fresh.length ? fresh : TIPS;
    let h = 0;
    for (let i = 0; i < dateKey.length; i++) h = (h * 31 + dateKey.charCodeAt(i)) >>> 0;
    return pool[h % pool.length];
  }

  return {
    SPECIES, SPECIES_BY_ID, STAGES, TIPS, TASKS, TASK_BY_ID, CARE,
    ACHIEVEMENTS, SHOP, SHOP_BY_ID, TAGS, TAG_BY_ID,
    stageFor, tasksFor, tipFor,
  };
})();


/* ===== js/finance.js ===== */
/* Zeroling — debt math. Kept free of game/UI concerns so it can be reasoned about on its own. */
const Finance = (() => {

  const MAX_MONTHS = 720;               // 60 years — past this we call it "never"
  const round2 = n => Math.round(n * 100) / 100;

  const monthlyRate = apr => (Number(apr) || 0) / 100 / 12;
  const dailyRate   = apr => (Number(apr) || 0) / 100 / 365;

  /* One month of interest on a balance. */
  function estInterest(balance, apr) {
    return round2(Math.max(0, balance) * monthlyRate(apr));
  }

  /* What a card costs you per day in interest right now — drives the pet's energy drain. */
  function dailyInterest(card) {
    return Math.max(0, card.balance) * dailyRate(card.apr);
  }

  function totalDailyInterest(cards) {
    return (cards || []).reduce((a, c) => a + dailyInterest(c), 0);
  }

  function total(cards) {
    return round2((cards || []).reduce((a, c) => a + Math.max(0, c.balance), 0));
  }

  /* Issuer minimums vary; when the user hasn't given one we use the common
     "1% of principal + this month's interest, floor $25" rule.
     declining: ignore the stated figure and apply that rule every month. A statement minimum
     is a snapshot of this same formula at today's balance — issuers recalculate it as the
     balance falls, which is precisely what makes minimum-only payoff take decades. Holding
     the stated dollar figure constant would understate the trap badly. */
  function minFor(card, declining = false) {
    const bal = Math.max(0, card.balance);
    if (bal <= 0) return 0;
    const int = estInterest(bal, card.apr);
    const stated = Number(card.minPayment) || 0;
    const rule = Math.max(25, bal * 0.01 + int);
    const m = (!declining && stated > 0) ? stated : rule;
    return round2(Math.min(bal + int, m));
  }

  function orderFor(cards, strategy) {
    const list = cards.filter(c => c.balance > 0.005).slice();
    if (strategy === 'snowball') {
      list.sort((a, b) => a.balance - b.balance || b.apr - a.apr);
    } else {
      list.sort((a, b) => (b.apr || 0) - (a.apr || 0) || a.balance - b.balance);
    }
    return list;
  }

  /**
   * Month-by-month payoff simulation.
   *
   * fixed budget (default): budget = sum of today's minimums + extra, held constant.
   *   Freed-up minimums roll onto the focus card — this is what makes snowball/avalanche work.
   * recalcMin: budget is recomputed from shrinking balances each month with no extra and no
   *   rollover. This is the honest "if I only ever pay the minimum" scenario.
   */
  function simulate(cards, opts = {}) {
    const strategy  = opts.strategy || 'avalanche';
    const extra     = Math.max(0, Number(opts.extra) || 0);
    const recalcMin = !!opts.recalcMin;

    let sim = (cards || [])
      .filter(c => c.balance > 0.005)
      .map(c => ({ id: c.id, name: c.name, apr: Number(c.apr) || 0, balance: c.balance, minPayment: c.minPayment }));

    if (!sim.length) {
      return { months: 0, totalInterest: 0, totalPaid: 0, payoffs: [], schedule: [{ m: 0, total: 0 }], never: false };
    }

    const budget = recalcMin ? 0 : round2(sim.reduce((a, c) => a + minFor(c), 0) + extra);
    const payoffs = [];
    const schedule = [{ m: 0, total: total(sim) }];
    let totalInterest = 0, totalPaid = 0, m = 0;

    while (sim.length && m < MAX_MONTHS) {
      m++;

      // 1. interest accrues
      for (const c of sim) {
        const i = estInterest(c.balance, c.apr);
        c.balance = round2(c.balance + i);
        totalInterest = round2(totalInterest + i);
      }

      // 2. pay minimums
      let pot = recalcMin ? 0 : budget;
      let paidThisMonth = 0;
      for (const c of sim) {
        const due = recalcMin ? minFor(c, true) : Math.min(minFor(c), pot);
        const pay = Math.min(due, c.balance);
        c.balance = round2(c.balance - pay);
        if (!recalcMin) pot = round2(pot - pay);
        paidThisMonth = round2(paidThisMonth + pay);
      }

      // 3. everything left goes at the focus card
      if (!recalcMin && pot > 0.005) {
        for (const c of orderFor(sim, strategy)) {
          if (pot <= 0.005) break;
          const pay = Math.min(pot, c.balance);
          c.balance = round2(c.balance - pay);
          pot = round2(pot - pay);
          paidThisMonth = round2(paidThisMonth + pay);
        }
      }

      totalPaid = round2(totalPaid + paidThisMonth);

      // 4. retire cleared cards
      const before = sim.length;
      sim = sim.filter(c => {
        if (c.balance <= 0.005) { payoffs.push({ id: c.id, name: c.name, month: m }); return false; }
        return true;
      });

      schedule.push({ m, total: total(sim) });

      // Nothing moved and nothing cleared — the payment can't outrun the interest.
      if (before === sim.length && paidThisMonth <= 0.005) break;
      if (schedule.length > 2 && schedule[schedule.length - 1].total >= schedule[schedule.length - 2].total && before === sim.length) {
        // balance grew or stalled this month; if that holds it will never clear
        if (m > 3) break;
      }
    }

    const never = sim.length > 0;
    return { months: never ? Infinity : m, totalInterest, totalPaid, payoffs, schedule, never, stuck: sim.map(c => c.name) };
  }

  /* Side-by-side of both strategies at the same extra payment. */
  function compare(cards, extra = 0) {
    const av = simulate(cards, { strategy: 'avalanche', extra });
    const sn = simulate(cards, { strategy: 'snowball', extra });
    const interestGap = round2(sn.totalInterest - av.totalInterest);
    const monthGap = (Number.isFinite(sn.months) && Number.isFinite(av.months)) ? sn.months - av.months : 0;
    return {
      avalanche: av, snowball: sn, interestGap, monthGap,
      // Small gap? The one you'll actually stick with wins.
      recommend: interestGap < 200 ? 'snowball' : 'avalanche',
    };
  }

  /* "What if I paid $X more a month" — returns the delta vs paying nothing extra. */
  function whatIf(cards, strategy, extra) {
    const base = simulate(cards, { strategy, extra: 0 });
    const boosted = simulate(cards, { strategy, extra });
    const monthsSaved = (Number.isFinite(base.months) && Number.isFinite(boosted.months))
      ? base.months - boosted.months : null;
    return {
      base, boosted, monthsSaved,
      interestSaved: round2(base.totalInterest - boosted.totalInterest),
    };
  }

  /* The reality check: what happens if you only ever pay the minimum. */
  function minimumsOnly(cards) {
    return simulate(cards, { recalcMin: true });
  }

  /* ---- formatting helpers ---- */
  function money(n, cents = false) {
    const v = Number(n);
    if (!Number.isFinite(v)) return '—';        // never render "NaN" or "$Infinity" at someone
    return v.toLocaleString(undefined, {
      style: 'currency', currency: 'USD',
      minimumFractionDigits: cents ? 2 : 0, maximumFractionDigits: cents ? 2 : 0,
    });
  }

  function monthsText(m) {
    if (!Number.isFinite(m)) return 'never';
    if (m <= 0) return 'done';
    const y = Math.floor(m / 12), r = m % 12;
    if (!y) return `${r} mo`;
    if (!r) return `${y} yr`;
    return `${y} yr ${r} mo`;
  }

  function payoffDate(months, from = new Date()) {
    if (!Number.isFinite(months)) return null;
    const d = new Date(from.getFullYear(), from.getMonth() + months, 1);
    return d;
  }

  function dateText(d) {
    return d ? d.toLocaleDateString(undefined, { month: 'short', year: 'numeric' }) : '—';
  }

  function periodKey(d = new Date()) {
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
  }

  function periodLabel(key) {
    const [y, m] = key.split('-').map(Number);
    return new Date(y, m - 1, 1).toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
  }

  function prevPeriod(key) {
    const [y, m] = key.split('-').map(Number);
    return periodKey(new Date(y, m - 2, 1));
  }

  return {
    monthlyRate, dailyRate, estInterest, dailyInterest, totalDailyInterest,
    total, minFor, orderFor, simulate, compare, whatIf, minimumsOnly,
    money, monthsText, payoffDate, dateText, periodKey, periodLabel, prevPeriod, round2,
  };
})();


/* ===== js/art.js ===== */
/* Zeroling — procedural art. Every pet, cosmetic and backdrop is drawn in code.
   Everything renders into a 0..100 x 0..100 space; the ground line sits at y=88. */
const Art = (() => {

  /* ---------------- colour helpers ---------------- */
  const hex = c => { const n = parseInt(c.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
  const rgb = a => `rgb(${a[0] | 0},${a[1] | 0},${a[2] | 0})`;
  const lerp = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);
  const SICK = [122, 138, 120], GLOW = [255, 244, 224];

  let MOOD = 'happy';                      // set per-draw; keeps tint() call sites short
  function tint(c) {
    const a = hex(c);
    if (MOOD === 'sick') return rgb(lerp(lerp(a, SICK, 0.44), [0, 0, 0], 0.10));
    if (MOOD === 'low')  return rgb(lerp(a, SICK, 0.20));
    if (MOOD === 'happy') return rgb(lerp(a, GLOW, 0.06));
    return rgb(a);
  }
  function shade(c, f) {
    const a = hex(c), t = f > 0 ? [255, 255, 255] : [0, 0, 0];
    return rgb(lerp(a, t, Math.abs(f)));
  }

  const ell = (ctx, x, y, rx, ry, rot = 0) => { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot, 0, 7); ctx.fill(); };
  function rr(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);         ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function star(ctx, x, y, r, pts = 8) {
    ctx.beginPath();
    for (let k = 0; k < pts * 2; k++) {
      const a = k * Math.PI / pts, rr2 = k % 2 ? r * 0.38 : r;
      const px = x + Math.cos(a) * rr2, py = y + Math.sin(a) * rr2;
      k ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
    }
    ctx.closePath(); ctx.fill();
  }

  /* ---------------- backgrounds ---------------- */
  function drawBg(ctx, id, t) {
    const g = ctx.createLinearGradient(0, 0, 0, 100);
    const band = (a, b) => { g.addColorStop(0, a); g.addColorStop(1, b); ctx.fillStyle = g; ctx.fillRect(0, 0, 100, 100); };

    if (id === 'b-dusk')        band('#f0a26a', '#7d5aa0');
    else if (id === 'b-night')  band('#1d2547', '#3c3a6b');
    else if (id === 'b-beach')  band('#87d6e6', '#f0dcae');
    else if (id === 'b-forest') band('#2f5f47', '#6e9a63');
    else if (id === 'b-cozy')   band('#d8b07e', '#a5764c');
    else if (id === 'b-aurora') band('#0f2740', '#123f52');
    else if (id === 'b-sakura') band('#f9d7e4', '#cfe8d6');
    else if (id === 'b-autumn') band('#eeb96f', '#9c5a2c');
    else if (id === 'b-snow')   band('#bcd6ec', '#eef5fb');
    else if (id === 'b-reef')   band('#1c6a92', '#57c3c9');
    else if (id === 'b-summit') band('#8db2d8', '#e8eff8');
    else if (id === '_flat')    band('#323d4c', '#252e3a');   // neutral tile for shop previews
    else                        band('#a8d8ea', '#8fbf7a');   // meadow (default)

    if (id === 'b-night' || id === 'b-aurora') {
      ctx.fillStyle = 'rgba(255,255,255,.85)';
      for (let i = 0; i < 18; i++) {
        const x = (i * 37 % 97) + 2, y = (i * 53 % 55) + 4;
        const tw = 0.5 + 0.5 * Math.sin(t * 1.6 + i);
        ctx.globalAlpha = 0.35 + tw * 0.55;
        ctx.beginPath(); ctx.arc(x, y, 0.5 + tw * 0.5, 0, 7); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
    if (id === 'b-aurora') {
      for (let i = 0; i < 3; i++) {
        ctx.globalAlpha = 0.18;
        ctx.fillStyle = ['#5fd3a0', '#5fa8d3', '#a05fd3'][i];
        ctx.beginPath();
        ctx.moveTo(0, 30 + i * 8);
        for (let x = 0; x <= 100; x += 10) ctx.lineTo(x, 26 + i * 8 + Math.sin(x / 14 + t * 0.5 + i) * 7);
        ctx.lineTo(100, 0); ctx.lineTo(0, 0); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
    if (id === 'b-beach') {
      ctx.fillStyle = '#4fb8c8';
      ctx.beginPath(); ctx.moveTo(0, 62);
      for (let x = 0; x <= 100; x += 8) ctx.lineTo(x, 62 + Math.sin(x / 9 + t) * 1.4);
      ctx.lineTo(100, 78); ctx.lineTo(0, 78); ctx.fill();
    }
    if (id === 'b-forest') {
      ctx.fillStyle = 'rgba(20,50,34,.55)';
      [12, 30, 72, 90].forEach((x, i) => {
        ctx.beginPath(); ctx.moveTo(x, 78);
        ctx.lineTo(x - 9 - i, 44 - i * 3); ctx.lineTo(x + 9 + i, 44 - i * 3); ctx.fill();
      });
    }
    if (id === 'b-sakura') {
      ctx.strokeStyle = '#6b4a3a'; ctx.lineWidth = 3; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(-2, 8); ctx.quadraticCurveTo(26, 14, 40, 4); ctx.stroke();
      for (let i = 0; i < 16; i++) {
        const p = ((t * 0.16 + i / 16) % 1);
        const x = (i * 61 % 96) + 2 + Math.sin(t * 0.9 + i) * 5, y = p * 96;
        ctx.fillStyle = i % 3 ? 'rgba(247,180,205,.92)' : 'rgba(255,225,236,.92)';
        ctx.beginPath(); ctx.ellipse(x, y, 2.1, 1.3, t * 0.7 + i, 0, 7); ctx.fill();
      }
      ctx.fillStyle = 'rgba(247,180,205,.95)';
      for (let i = 0; i < 7; i++) ell(ctx, 4 + i * 6.2, 8 + Math.sin(i) * 4, 4, 3.2);
    }
    if (id === 'b-autumn') {
      ctx.fillStyle = 'rgba(74,44,22,.42)';
      [14, 42, 78].forEach((x, i) => { ctx.fillRect(x - 2.5, 20 - i * 3, 5, 58); });
      ctx.fillStyle = 'rgba(196,104,44,.55)';
      [14, 42, 78].forEach((x, i) => ell(ctx, x, 20 - i * 3, 17 - i, 11));
      for (let i = 0; i < 12; i++) {
        const p = ((t * 0.2 + i / 12) % 1);
        const x = (i * 47 % 94) + 3 + Math.sin(t * 1.3 + i) * 7, y = p * 94;
        ctx.fillStyle = ['#d9803f', '#c25a2e', '#e0a94a'][i % 3];
        ctx.beginPath(); ctx.ellipse(x, y, 2.4, 1.5, t * 1.6 + i, 0, 7); ctx.fill();
      }
    }
    if (id === 'b-snow') {
      ctx.fillStyle = 'rgba(255,255,255,.55)';
      ell(ctx, 22, 76, 26, 8); ell(ctx, 74, 79, 30, 9);
      for (let i = 0; i < 22; i++) {
        const p = ((t * 0.13 + i / 22) % 1);
        const x = (i * 43 % 98) + 1 + Math.sin(t * 0.7 + i) * 4, y = p * 98;
        ctx.fillStyle = 'rgba(255,255,255,.95)';
        ctx.beginPath(); ctx.arc(x, y, 1 + (i % 3) * 0.5, 0, 7); ctx.fill();
      }
    }
    if (id === 'b-reef') {
      ctx.fillStyle = 'rgba(255,255,255,.10)';
      for (let i = 0; i < 4; i++) {
        ctx.beginPath(); ctx.moveTo(i * 28 - 8, 0);
        ctx.lineTo(i * 28 + 8, 0); ctx.lineTo(i * 28 + 22, 78); ctx.lineTo(i * 28 + 2, 78); ctx.fill();
      }
      ['#e8765f', '#e8a94f', '#c96fb0'].forEach((c, i) => {
        ctx.fillStyle = c; const x = 12 + i * 34;
        ctx.beginPath(); ctx.moveTo(x, 80);
        ctx.quadraticCurveTo(x - 7, 64, x - 3, 54); ctx.quadraticCurveTo(x + 3, 62, x + 4, 52);
        ctx.quadraticCurveTo(x + 9, 63, x + 8, 80); ctx.fill();
      });
      for (let i = 0; i < 8; i++) {
        const p = ((t * 0.22 + i / 8) % 1);
        ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 0.8;
        ctx.beginPath(); ctx.arc(10 + i * 11, 84 - p * 80, 1.4 + (i % 3), 0, 7); ctx.stroke();
      }
    }
    if (id === 'b-summit') {
      ctx.fillStyle = 'rgba(92,120,152,.75)';
      ctx.beginPath(); ctx.moveTo(-8, 74); ctx.lineTo(24, 26); ctx.lineTo(56, 74); ctx.fill();
      ctx.beginPath(); ctx.moveTo(46, 74); ctx.lineTo(76, 34); ctx.lineTo(108, 74); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.92)';
      ctx.beginPath(); ctx.moveTo(24, 26); ctx.lineTo(33, 40); ctx.lineTo(27, 38); ctx.lineTo(21, 42); ctx.lineTo(15, 40); ctx.fill();
      ctx.beginPath(); ctx.moveTo(76, 34); ctx.lineTo(84, 46); ctx.lineTo(78, 44); ctx.lineTo(72, 48); ctx.lineTo(68, 46); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.5)';
      ell(ctx, 20 + Math.sin(t * 0.4) * 6, 16, 13, 4); ell(ctx, 72 - Math.sin(t * 0.3) * 5, 22, 10, 3.4);
    }
    if (id === 'b-cozy') {
      ctx.fillStyle = 'rgba(90,58,34,.35)'; ctx.fillRect(0, 70, 100, 30);
      ctx.fillStyle = 'rgba(255,235,190,.30)';
      rr(ctx, 8, 16, 26, 26, 3); ctx.fill();
      rr(ctx, 66, 16, 26, 26, 3); ctx.fill();
    }

    // ground
    const GROUND = {
      'b-night': '#2c3a4e', 'b-beach': '#efe0b4', 'b-forest': '#3f6b46', 'b-cozy': '#8c6039',
      'b-dusk': '#6b5a7e', 'b-aurora': '#15303f', 'b-sakura': '#9ecb88', 'b-autumn': '#8a5a30',
      'b-snow': '#f2f8fd', 'b-reef': '#ddcb9e', 'b-summit': '#eef4fa', '_flat': '#1c232d',
    };
    ctx.fillStyle = GROUND[id] || '#7bb166';
    ctx.beginPath(); ctx.ellipse(50, 108, 78, 26, 0, 0, 7); ctx.fill();
  }

  /* ---------------- cosmetics ---------------- */
  // Hats draw inside the head transform (origin = head centre, hr = head radius).
  function drawHat(ctx, id, hr, item) {
    const c = item.c;
    if (id === 'h-beanie') {
      ctx.fillStyle = c;
      ctx.beginPath(); ctx.arc(0, -hr * 0.58, hr * 0.78, Math.PI, 0); ctx.fill();
      ctx.fillStyle = shade(c, -0.18); rr(ctx, -hr * 0.80, -hr * 0.62, hr * 1.60, hr * 0.24, hr * 0.12); ctx.fill();
      ctx.fillStyle = shade(c, 0.35); ell(ctx, 0, -hr * 1.34, hr * 0.17, hr * 0.17);
    } else if (id === 'h-bow') {
      ctx.fillStyle = c;
      ell(ctx, -hr * 0.62, -hr * 0.86, hr * 0.28, hr * 0.20, -0.4);
      ell(ctx, -hr * 0.16, -hr * 0.86, hr * 0.28, hr * 0.20, 0.4);
      ctx.fillStyle = shade(c, -0.22); ell(ctx, -hr * 0.39, -hr * 0.86, hr * 0.10, hr * 0.10);
    } else if (id === 'h-party') {
      ctx.fillStyle = c;
      ctx.beginPath(); ctx.moveTo(0, -hr * 1.62); ctx.lineTo(-hr * 0.42, -hr * 0.66); ctx.lineTo(hr * 0.42, -hr * 0.66); ctx.fill();
      ctx.fillStyle = shade(c, 0.4);
      ctx.beginPath(); ctx.moveTo(0, -hr * 1.62); ctx.lineTo(-hr * 0.12, -hr * 0.66); ctx.lineTo(hr * 0.10, -hr * 0.66); ctx.fill();
      ctx.fillStyle = '#f7e07a'; ell(ctx, 0, -hr * 1.70, hr * 0.13, hr * 0.13);
    } else if (id === 'h-flower') {
      ctx.fillStyle = '#4f8a44';
      ctx.strokeStyle = '#4f8a44'; ctx.lineWidth = hr * 0.07; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(hr * 0.55, -hr * 0.55); ctx.lineTo(hr * 0.66, -hr * 0.86); ctx.stroke();
      for (let i = 0; i < 5; i++) {
        const a = i * Math.PI * 2 / 5 - 0.5;
        ctx.fillStyle = c;
        ell(ctx, hr * 0.66 + Math.cos(a) * hr * 0.16, -hr * 0.92 + Math.sin(a) * hr * 0.16, hr * 0.13, hr * 0.13);
      }
      ctx.fillStyle = '#f7f0d0'; ell(ctx, hr * 0.66, -hr * 0.92, hr * 0.09, hr * 0.09);
    } else if (id === 'h-top') {
      ctx.fillStyle = c;
      rr(ctx, -hr * 0.86, -hr * 0.74, hr * 1.72, hr * 0.16, hr * 0.07); ctx.fill();
      rr(ctx, -hr * 0.48, -hr * 1.56, hr * 0.96, hr * 0.86, hr * 0.06); ctx.fill();
      ctx.fillStyle = '#b8404a'; rr(ctx, -hr * 0.48, -hr * 0.94, hr * 0.96, hr * 0.18, 0); ctx.fill();
    } else if (id === 'h-crown') {
      ctx.fillStyle = c;
      ctx.beginPath();
      ctx.moveTo(-hr * 0.56, -hr * 0.62); ctx.lineTo(-hr * 0.56, -hr * 1.10);
      ctx.lineTo(-hr * 0.28, -hr * 0.86); ctx.lineTo(0, -hr * 1.24);
      ctx.lineTo(hr * 0.28, -hr * 0.86);  ctx.lineTo(hr * 0.56, -hr * 1.10);
      ctx.lineTo(hr * 0.56, -hr * 0.62); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#d8484f';
      [-0.30, 0, 0.30].forEach(x => ell(ctx, hr * x, -hr * 0.76, hr * 0.08, hr * 0.08));
    } else if (id === 'h-halo') {
      ctx.strokeStyle = c; ctx.lineWidth = hr * 0.12;
      ctx.shadowColor = c; ctx.shadowBlur = 6;
      ctx.beginPath(); ctx.ellipse(0, -hr * 1.22, hr * 0.52, hr * 0.17, 0, 0, 7); ctx.stroke();
      ctx.shadowBlur = 0;
    }
  }

  // Neckwear draws in body space (origin = pet space, neck point passed in).
  function drawNeck(ctx, id, nx, ny, w, item) {
    const c = item.c;
    if (id === 'n-scarf') {
      ctx.fillStyle = c; rr(ctx, nx - w * 0.62, ny - w * 0.16, w * 1.24, w * 0.34, w * 0.16); ctx.fill();
      ctx.fillStyle = shade(c, -0.15); rr(ctx, nx + w * 0.18, ny + w * 0.10, w * 0.30, w * 0.62, w * 0.12); ctx.fill();
    } else if (id === 'n-bandana') {
      ctx.fillStyle = c;
      ctx.beginPath();
      ctx.moveTo(nx - w * 0.60, ny - w * 0.10); ctx.lineTo(nx + w * 0.60, ny - w * 0.10);
      ctx.lineTo(nx, ny + w * 0.72); ctx.closePath(); ctx.fill();
      ctx.fillStyle = shade(c, -0.2); rr(ctx, nx - w * 0.64, ny - w * 0.20, w * 1.28, w * 0.20, w * 0.09); ctx.fill();
    } else if (id === 'n-bowtie') {
      ctx.fillStyle = c;
      ell(ctx, nx - w * 0.26, ny + w * 0.06, w * 0.26, w * 0.20, -0.35);
      ell(ctx, nx + w * 0.26, ny + w * 0.06, w * 0.26, w * 0.20, 0.35);
      ctx.fillStyle = shade(c, -0.25); ell(ctx, nx, ny + w * 0.06, w * 0.11, w * 0.13);
    } else if (id === 'n-medal') {
      ctx.strokeStyle = '#c8455a'; ctx.lineWidth = w * 0.10;
      ctx.beginPath(); ctx.moveTo(nx - w * 0.26, ny - w * 0.10);
      ctx.lineTo(nx, ny + w * 0.36); ctx.lineTo(nx + w * 0.26, ny - w * 0.10); ctx.stroke();
      ctx.fillStyle = c; ell(ctx, nx, ny + w * 0.50, w * 0.20, w * 0.20);
      ctx.fillStyle = shade(c, -0.28); ell(ctx, nx, ny + w * 0.50, w * 0.11, w * 0.11);
    }
  }

  /* ---------------- the pet ---------------- */
  /**
   * opts: { species, t, mood:'happy'|'ok'|'low'|'sick', scale, hat, neck }
   */
  function drawPet(ctx, opts) {
    const sp = opts.species;
    const t = opts.t || 0;
    MOOD = opts.mood || 'happy';
    const sc = opts.scale == null ? 1 : opts.scale;
    const baby = sc < 0.82;

    // ---- motion driven by mood ----
    let bob, sway, droop, lidBase, mouth;
    if (MOOD === 'happy')     { bob = -Math.abs(Math.sin(t * 2.7)) * 4.2; sway = Math.sin(t * 2.7) * 0.20; droop = 0;    lidBase = 0;    mouth = 1; }
    else if (MOOD === 'ok')   { bob = Math.sin(t * 1.5) * 1.5;            sway = Math.sin(t * 1.2) * 0.10; droop = 0.16; lidBase = 0.12; mouth = 0.3; }
    else if (MOOD === 'low')  { bob = Math.sin(t * 1.1) * 1.1 + 1.2;      sway = Math.sin(t * 0.9) * 0.07; droop = 0.48; lidBase = 0.32; mouth = -0.4; }
    else                      { bob = Math.sin(t * 0.85) * 0.9 + 2.6;     sway = Math.sin(t * 0.7) * 0.05; droop = 0.88; lidBase = 0.56; mouth = -1; }

    const blink = (t % 3.6) < 0.14 ? 1 : 0;
    const lid = Math.min(1, lidBase + blink);
    const breath = Math.sin(t * (MOOD === 'sick' ? 1.1 : 2.1)) * (MOOD === 'sick' ? 0.5 : 0.8);

    ctx.save();
    ctx.translate(50, 88);
    ctx.scale(sc, sc);
    ctx.translate(-50, -88);

    const upright = sp.build === 'upright';
    const longish = sp.build === 'long';

    const g = upright
      ? { bx: 50, by: 60 + bob, brx: 19, bry: 25 + breath * 0.6, hx: 50, hy: 27 + bob, hr: 16 }
      : longish
      ? { bx: 50, by: 65 + bob, brx: 24, bry: 19 + breath * 0.6, hx: 50, hy: 31 + bob, hr: 16 }
      : { bx: 50, by: 63 + bob, brx: 25, bry: 21 + breath * 0.6, hx: 50, hy: 33 + bob, hr: 20 };

    // ---- ground shadow ----
    ctx.fillStyle = `rgba(0,0,0,${MOOD === 'happy' ? 0.28 : 0.20})`;
    ell(ctx, 50, 88, g.brx * (1 + bob * 0.012), g.brx * 0.24);

    // ---- tail (behind) ----
    drawTail(ctx, sp, g, t, sway, baby);

    // ---- body ----
    ctx.fillStyle = tint(sp.coat);
    if (upright) {
      ctx.beginPath(); ctx.ellipse(g.bx, g.by, g.brx, g.bry, 0, 0, 7); ctx.fill();
      // flippers
      ctx.fillStyle = tint(sp.coat2);
      [-1, 1].forEach(s => {
        ctx.save();
        ctx.translate(g.bx + s * g.brx * 0.92, g.by - 2);
        ctx.rotate(s * (0.30 + droop * 0.35) + Math.sin(t * 2.2 + s) * (MOOD === 'happy' ? 0.22 : 0.05));
        ell(ctx, 0, g.bry * 0.30, g.brx * 0.24, g.bry * 0.52);
        ctx.restore();
      });
      // feet
      ctx.fillStyle = tint(sp.nose);
      ell(ctx, g.bx - g.brx * 0.44, g.by + g.bry * 0.96, g.brx * 0.30, g.brx * 0.14);
      ell(ctx, g.bx + g.brx * 0.44, g.by + g.bry * 0.96, g.brx * 0.30, g.brx * 0.14);
      // white bib
      ctx.fillStyle = tint(sp.under);
      ell(ctx, g.bx, g.by + g.bry * 0.10, g.brx * 0.66, g.bry * 0.80);
    } else {
      ell(ctx, g.bx, g.by, g.brx, g.bry);
      ctx.fillStyle = tint(sp.under);
      ell(ctx, g.bx, g.by + g.bry * 0.34, g.brx * 0.60, g.bry * 0.56);
      if (sp.stripes) {
        ctx.strokeStyle = tint(sp.coat2); ctx.lineWidth = 1.8; ctx.lineCap = 'round';
        [-0.5, 0, 0.5].forEach(o => {
          ctx.beginPath();
          ctx.arc(g.bx, g.by - g.bry * 0.30 + o * g.bry * 0.5, g.brx * 0.62, Math.PI * 1.15, Math.PI * 1.85);
          ctx.stroke();
        });
      }
      // front paws
      ctx.fillStyle = tint(sp.mask === 'fox' ? sp.earIn : sp.coat2);
      const pw = baby ? 5.6 : 6.8, py = g.by + g.bry * 0.82;
      ell(ctx, g.bx - g.brx * 0.46, py, pw, pw * 0.72);
      ell(ctx, g.bx + g.brx * 0.46, py, pw, pw * 0.72);
      // horse hooves + mane down the chest
      if (longish && sp.mane) {
        ctx.fillStyle = tint(sp.mane);
        ell(ctx, g.bx, g.by - g.bry * 0.72, g.brx * 0.16, g.bry * 0.42);
      }
    }

    // ---- neckwear (behind head, in front of body) ----
    if (opts.neck) {
      const item = { c: opts.neck.c };
      drawNeck(ctx, opts.neck.id, g.hx, g.hy + g.hr * 0.90, g.hr, item);
    }

    // ---- head ----
    ctx.save();
    ctx.translate(g.hx, g.hy);
    ctx.rotate(sway * 0.35 + (MOOD === 'sick' ? 0.13 : 0));

    drawEars(ctx, sp, g.hr, droop, t, baby);

    ctx.fillStyle = tint(sp.coat);
    if (longish) ell(ctx, 0, 0, g.hr * 0.92, g.hr * 1.06);
    else ell(ctx, 0, 0, g.hr, g.hr * 0.94);

    if (longish && sp.mane) {                       // forelock
      ctx.fillStyle = tint(sp.mane);
      ell(ctx, 0, -g.hr * 0.78, g.hr * 0.46, g.hr * 0.34);
    }

    drawFace(ctx, sp, g.hr, lid, mouth, baby);

    if (opts.hat) drawHat(ctx, opts.hat.id, g.hr, { c: opts.hat.c });
    ctx.restore();

    // ---- particles ----
    drawParticles(ctx, t);
    ctx.restore();
  }

  function drawTail(ctx, sp, g, t, sway, baby) {
    const k = sp.tail;
    if (k === 'none') return;
    ctx.save();
    if (k === 'striped' || k === 'bushy') {
      ctx.translate(g.bx - g.brx * 0.72, g.by + 4);
      ctx.rotate(sway * 0.9 + (MOOD === 'sick' ? 0.55 : -0.10));
      const L = baby ? 24 : 32, seg = 6, w0 = baby ? 6 : 7.6;
      for (let i = seg - 1; i >= 0; i--) {
        const f = i / (seg - 1);
        const x = -L * f, y = -Math.pow(f, 1.7) * (baby ? 9 : 13);
        ctx.fillStyle = k === 'striped'
          ? tint(i % 2 ? sp.under : sp.coat2)
          : tint(i === 0 ? sp.under : sp.coat);         // fox: white tip
        const r = w0 * (1 - f * 0.30);
        ell(ctx, x, y, r, r);
      }
    } else if (k === 'thin') {
      ctx.translate(g.bx - g.brx * 0.80, g.by + 2);
      ctx.strokeStyle = tint(sp.coat); ctx.lineCap = 'round'; ctx.lineWidth = baby ? 4.5 : 5.5;
      const w = MOOD === 'happy' ? Math.sin(t * 3.4) * 0.5 : sway + (MOOD === 'sick' ? 0.5 : 0);
      ctx.rotate(w * 0.5);
      ctx.beginPath(); ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(-16, -6, -13, baby ? -18 : -24);
      ctx.stroke();
    } else if (k === 'curl') {
      ctx.translate(g.bx + g.brx * 0.80, g.by - 4);
      ctx.rotate(MOOD === 'happy' ? Math.sin(t * 9) * 0.42 : sway * 0.8 + (MOOD === 'sick' ? 0.75 : 0));
      ctx.strokeStyle = tint(sp.coat2); ctx.lineCap = 'round'; ctx.lineWidth = baby ? 6 : 7.5;
      ctx.beginPath(); ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(baby ? 11 : 15, -4, baby ? 9 : 12, baby ? -13 : -17);
      ctx.stroke();
    } else if (k === 'hair') {
      ctx.translate(g.bx - g.brx * 0.86, g.by - 2);
      ctx.rotate(sway * 0.6 + (MOOD === 'sick' ? 0.3 : 0));
      ctx.strokeStyle = tint(sp.mane || sp.coat2); ctx.lineCap = 'round'; ctx.lineWidth = 3;
      for (let i = -1; i <= 1; i++) {
        ctx.beginPath(); ctx.moveTo(0, 0);
        ctx.quadraticCurveTo(-6 + i * 2, 10, -3 + i * 4, baby ? 18 : 23); ctx.stroke();
      }
    } else if (k === 'finned') {
      ctx.translate(g.bx - g.brx * 0.78, g.by + 2);
      ctx.rotate(Math.sin(t * 2.2) * 0.18 + sway * 0.5);
      ctx.fillStyle = tint(sp.coat2);
      ctx.beginPath();
      ctx.moveTo(0, -6); ctx.quadraticCurveTo(-20, -10, baby ? -20 : -26, 2);
      ctx.quadraticCurveTo(-20, 12, 0, 7); ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }

  function drawEars(ctx, sp, hr, droop, t, baby) {
    const k = sp.ears;
    if (k === 'none') return;
    const earR = baby ? hr * 0.50 : hr * 0.44;

    if (k === 'frill') {                              // axolotl gills
      [-1, 1].forEach(s => {
        for (let i = 0; i < 3; i++) {
          ctx.save();
          ctx.translate(s * hr * 0.86, -hr * 0.20 + i * hr * 0.30);
          ctx.rotate(s * (0.5 + i * 0.35 + droop * 0.5) + Math.sin(t * 2 + i) * 0.06);
          ctx.fillStyle = tint(i % 2 ? sp.earIn : sp.earOut);
          ell(ctx, s * hr * 0.34, 0, hr * 0.34, hr * 0.11);
          ctx.restore();
        }
      });
      return;
    }
    if (k === 'floppy') {
      [-1, 1].forEach(s => {
        ctx.save();
        ctx.translate(s * hr * 0.86, -hr * 0.20);
        ctx.rotate(s * (0.18 + droop * 0.30) + Math.sin(t * 2.4 + s) * 0.05);
        ctx.fillStyle = tint(sp.earOut);
        ell(ctx, s * earR * 0.20, earR * 0.85, earR * 0.66, earR * 1.35, s * 0.18);
        ctx.restore();
      });
      return;
    }
    if (k === 'point') {                              // cat / fox triangles
      [-1, 1].forEach(s => {
        ctx.save();
        ctx.translate(s * hr * 0.62, -hr * 0.66);
        ctx.rotate(s * (0.16 + droop * 0.95));
        ctx.fillStyle = tint(sp.earOut);
        ctx.beginPath();
        ctx.moveTo(-earR * 0.62, earR * 0.52); ctx.lineTo(0, -earR * 1.15); ctx.lineTo(earR * 0.62, earR * 0.52);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = tint(sp.earIn);
        ctx.beginPath();
        ctx.moveTo(-earR * 0.30, earR * 0.36); ctx.lineTo(0, -earR * 0.62); ctx.lineTo(earR * 0.30, earR * 0.36);
        ctx.closePath(); ctx.fill();
        ctx.restore();
      });
      return;
    }
    if (k === 'tall') {                               // horse
      [-1, 1].forEach(s => {
        ctx.save();
        ctx.translate(s * hr * 0.52, -hr * 0.86);
        ctx.rotate(s * (0.12 + droop * 1.0));
        ctx.fillStyle = tint(sp.earOut); ell(ctx, 0, 0, earR * 0.44, earR * 1.20);
        ctx.fillStyle = tint(sp.earIn);  ell(ctx, 0, earR * 0.10, earR * 0.22, earR * 0.78);
        ctx.restore();
      });
      return;
    }
    // 'perk' (red panda) and 'tiny' (capybara)
    const off = k === 'tiny' ? hr * 0.76 : hr * 0.80;
    const ey  = k === 'tiny' ? -hr * 0.50 : -hr * 0.70;
    const er  = k === 'tiny' ? earR * 0.55 : earR;
    [-1, 1].forEach(s => {
      ctx.save();
      ctx.translate(s * off, ey);
      ctx.rotate(s * (0.25 + droop * 0.85));
      ctx.fillStyle = tint(sp.earOut); ell(ctx, 0, 0, er, er * 1.12);
      ctx.fillStyle = tint(sp.earIn);  ell(ctx, 0, er * 0.16, er * 0.52, er * 0.62);
      ctx.restore();
    });
  }

  function drawFace(ctx, sp, hr, lid, mouth, baby) {
    // muzzle / mask plates
    if (sp.mask === 'panda') {
      ctx.fillStyle = tint(sp.face);
      ell(ctx, 0, hr * 0.22, hr * 0.70, hr * 0.58);
      ell(ctx, -hr * 0.56, -hr * 0.20, hr * 0.30, hr * 0.34, -0.4);
      ell(ctx,  hr * 0.56, -hr * 0.20, hr * 0.30, hr * 0.34,  0.4);
      ctx.fillStyle = tint(sp.under);
      ell(ctx, -hr * 0.38, -hr * 0.08, hr * 0.30, hr * 0.26, -0.25);
      ell(ctx,  hr * 0.38, -hr * 0.08, hr * 0.30, hr * 0.26,  0.25);
    } else if (sp.mask === 'fox') {
      ctx.fillStyle = tint(sp.face);
      ctx.beginPath();
      ctx.moveTo(-hr * 0.52, hr * 0.05);
      ctx.quadraticCurveTo(0, hr * 0.30, hr * 0.52, hr * 0.05);
      ctx.quadraticCurveTo(hr * 0.30, hr * 0.86, 0, hr * 0.80);
      ctx.quadraticCurveTo(-hr * 0.30, hr * 0.86, -hr * 0.52, hr * 0.05);
      ctx.fill();
    } else if (sp.mask === 'snout') {
      ctx.fillStyle = tint(sp.face); ell(ctx, 0, hr * 0.34, hr * 0.52, hr * 0.40);
    } else if (sp.mask === 'muzzle') {
      ctx.fillStyle = tint(sp.face === sp.coat ? shade(sp.coat, 0.18) : sp.face);
      ell(ctx, 0, hr * 0.44, hr * 0.42, hr * 0.46);
    } else if (sp.mask === 'bib') {
      ctx.fillStyle = tint(sp.face);
      ell(ctx, 0, hr * 0.16, hr * 0.66, hr * 0.72);
    } else {
      ctx.fillStyle = tint(sp.face); ell(ctx, 0, hr * 0.40, hr * 0.58, hr * 0.42);
    }

    // eyes
    const wide = sp.mask === 'bib' || sp.smile === 'wide';
    const exo = hr * (wide ? 0.44 : sp.mask === 'panda' ? 0.38 : 0.36);
    const eyo = -hr * (wide ? 0.06 : 0.08);
    const er = baby ? hr * 0.19 : hr * 0.155;
    [-1, 1].forEach(s => {
      const x = s * exo;
      ctx.fillStyle = sp.eye || '#1b1410';
      if (lid > 0.9) {
        ctx.strokeStyle = sp.eye || '#1b1410'; ctx.lineWidth = hr * 0.075; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(x - er, eyo); ctx.quadraticCurveTo(x, eyo + er * 0.45, x + er, eyo); ctx.stroke();
      } else {
        ctx.save();
        ctx.beginPath(); ctx.ellipse(x, eyo, er, er * (1 - lid * 0.72), 0, 0, 7); ctx.clip();
        ell(ctx, x, eyo, er, er);
        ctx.fillStyle = 'rgba(255,255,255,.92)';
        ell(ctx, x - er * 0.30, eyo - er * 0.34, er * 0.30, er * 0.30);
        ctx.restore();
        if (MOOD !== 'happy') {
          ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = hr * 0.05;
          ctx.beginPath();
          ctx.moveTo(x - er * 1.05, eyo - er * (1 - lid * 0.7));
          ctx.lineTo(x + er * 1.05, eyo - er * (1 - lid * 0.7) - er * 0.25);
          ctx.stroke();
        }
      }
    });

    // nose / beak + mouth
    if (sp.beak) {
      ctx.fillStyle = tint(sp.nose);
      ctx.beginPath();
      ctx.moveTo(-hr * 0.20, hr * 0.26); ctx.lineTo(hr * 0.20, hr * 0.26); ctx.lineTo(0, hr * 0.62);
      ctx.closePath(); ctx.fill();
      return;
    }
    const ny = hr * (sp.mask === 'muzzle' ? 0.32 : 0.24);
    ctx.fillStyle = tint(sp.nose);
    if (sp.mask === 'muzzle') {
      ell(ctx, -hr * 0.15, ny, hr * 0.07, hr * 0.09);
      ell(ctx,  hr * 0.15, ny, hr * 0.07, hr * 0.09);
    } else {
      ell(ctx, 0, ny, hr * 0.13, hr * 0.10);
    }

    ctx.strokeStyle = tint(sp.nose); ctx.lineWidth = hr * 0.055; ctx.lineCap = 'round';
    if (sp.smile === 'wide') {                          // axolotl grin
      const mo = hr * 0.42, mw = hr * 0.40;
      ctx.beginPath();
      ctx.moveTo(-mw, mo); ctx.quadraticCurveTo(0, mo + mouth * hr * 0.22, mw, mo);
      ctx.stroke();
      if (MOOD === 'happy') {
        ctx.fillStyle = 'rgba(232,120,110,.32)';
        ell(ctx, -hr * 0.70, hr * 0.34, hr * 0.20, hr * 0.13);
        ell(ctx,  hr * 0.70, hr * 0.34, hr * 0.20, hr * 0.13);
      }
      return;
    }
    ctx.beginPath();
    ctx.moveTo(0, ny + hr * 0.08); ctx.lineTo(0, ny + hr * 0.17); ctx.stroke();
    const mo = ny + hr * 0.19, mw = hr * 0.20;
    ctx.beginPath();
    ctx.moveTo(-mw, mo); ctx.quadraticCurveTo(-mw * 0.5, mo + mouth * hr * 0.11, 0, mo);
    ctx.quadraticCurveTo(mw * 0.5, mo + mouth * hr * 0.11, mw, mo);
    ctx.stroke();

    if (MOOD === 'happy') {
      ctx.fillStyle = 'rgba(232,120,110,.30)';
      ell(ctx, -hr * 0.66, hr * 0.24, hr * 0.19, hr * 0.12);
      ell(ctx,  hr * 0.66, hr * 0.24, hr * 0.19, hr * 0.12);
    }
  }

  function drawParticles(ctx, t) {
    if (MOOD === 'happy') {
      for (let i = 0; i < 3; i++) {
        const p = (t * 0.55 + i / 3) % 1;
        const x = 50 + Math.sin(i * 2.1 + t * 0.8) * 30, y = 62 - p * 44;
        const a = Math.sin(p * Math.PI);
        ctx.fillStyle = `rgba(255,225,140,${a * 0.95})`;
        star(ctx, x, y, 2.6 * a);
      }
    } else if (MOOD === 'sick') {
      for (let i = 0; i < 3; i++) {
        const p = (t * 0.32 + i / 3) % 1;
        const x = 66 + Math.sin(i * 3 + t * 1.1) * 5, y = 34 - p * 22;
        ctx.fillStyle = `rgba(140,190,130,${(1 - p) * 0.5})`;
        ctx.beginPath(); ctx.arc(x, y, 1.6 + p * 2.6, 0, 7); ctx.fill();
      }
      ctx.fillStyle = 'rgba(150,205,235,.85)';
      const dy = 22 + Math.sin(t * 1.4) * 1.6;
      ctx.beginPath();
      ctx.moveTo(69, dy); ctx.quadraticCurveTo(72.4, 27, 69, 29.4); ctx.quadraticCurveTo(65.6, 27, 69, dy);
      ctx.fill();
    } else if (MOOD === 'low') {
      ctx.fillStyle = 'rgba(120,140,160,.5)';
      const p = (t * 0.3) % 1;
      ctx.font = '9px sans-serif';
      ctx.globalAlpha = 1 - p;
      ctx.fillText('z', 68, 30 - p * 12);
      ctx.globalAlpha = 1;
    }
  }

  /* ---------------- canvas plumbing ---------------- */
  /* Sizes the canvas for the device pixel ratio and draws bg + pet in one call. */
  function render(canvas, opts) {
    const cssW = canvas.clientWidth || opts.size || 200;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const px = Math.round(cssW * dpr);
    if (canvas.width !== px) { canvas.width = px; canvas.height = px; }
    const ctx = canvas.getContext('2d');
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.scale(px / 100, px / 100);
    if (opts.bg !== false) { ctx.save(); drawBg(ctx, opts.bg, opts.t || 0); ctx.restore(); }
    drawPet(ctx, opts);
  }

  /* Static portrait for pickers and shop tiles. */
  function portraitURL(species, size = 128, extra = {}) {
    const c = document.createElement('canvas');
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    c.width = c.height = Math.round(size * dpr);
    const ctx = c.getContext('2d');
    ctx.scale(c.width / 100, c.width / 100);
    if (extra.bg) { ctx.save(); drawBg(ctx, extra.bg, 0.4); ctx.restore(); }
    drawPet(ctx, Object.assign({ species, t: 0.42, mood: 'happy', scale: 0.92 }, extra));
    return c.toDataURL();
  }

  /* Shop tiles show your own pet wearing the accessory, or standing in the backdrop —
     far more useful than an abstract icon, and it costs nothing extra to draw.
     Cached because the shop re-renders on every purchase and equip. */
  const thumbCache = {};
  function itemThumbURL(species, item, size = 104) {
    const key = species.id + '|' + item.id + '|' + size;
    if (thumbCache[key]) return thumbCache[key];
    const extra = { scale: 0.9 };
    if (item.slot === 'bg') extra.bg = item.id;
    else { extra.bg = '_flat'; extra[item.slot] = item; }
    return (thumbCache[key] = portraitURL(species, size, extra));
  }
  function clearThumbCache() { for (const k of Object.keys(thumbCache)) delete thumbCache[k]; }

  return { render, drawPet, drawBg, portraitURL, itemThumbURL, clearThumbCache, tint, shade };
})();


/* ===== js/state.js ===== */
/* Zeroling — save state. Everything lives in localStorage; nothing leaves the device. */
const State = (() => {
  const KEY = 'zeroling_save_1';

  function defaults() {
    const now = Date.now();
    return {
      version: 1,
      created: now,
      lastSeen: now,
      onboarded: false,
      pet: { species: null, name: '', born: now },
      cards: [],                 // {id,name,balance,apr,minPayment,limit,startBalance,createdAt}
      baseline: 0,               // starting total debt — growth % is measured against this
      entries: [],               // {id,cardId,period,at,charges,tag,payment,interest,before,after}
      history: [],               // {at,total} wall-clock snapshots (the chart uses Game.debtSeries)
      coins: 0,
      vitals: { health: 72, happy: 72, energy: 72, at: now },
      care: {},                  // careId -> last used timestamp
      daily: { date: '', done: [], perfect: false },
      tips: { seen: [], lastDate: '' },
      achievements: [],
      shop: { owned: ['b-meadow'], equipped: { hat: null, neck: null, bg: 'b-meadow' } },
      strategy: 'avalanche',
      stats: { tasksDone: 0, monthsLogged: 0, paidTotal: 0, chargedTotal: 0, interestTotal: 0,
               cleanStreak: 0, perfectDays: 0, recoveries: 0 },
      streak: { months: 0, best: 0, grace: 1 },
      visits: { streak: 0, best: 0, lastDay: '', total: 0 },   // daily check-in streak
      settings: { extra: 0, reduceMotion: false },
    };
  }

  const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);

  /* ---------------- coercion helpers ----------------
     A save file is untrusted input: it can be hand-edited in devtools, corrupted, or
     handed to the user by someone else. Everything below is coerced to the right
     type and range rather than believed. */
  const MAXNUM = 1e12;
  const num = (v, def = 0) => {
    const n = typeof v === 'number' ? v : parseFloat(v);
    return Number.isFinite(n) ? Math.max(-MAXNUM, Math.min(MAXNUM, n)) : def;
  };
  const pos = (v, def = 0) => Math.max(0, num(v, def));
  const int = (v, def = 0) => Math.round(pos(v, def));
  const str = (v, max, def = '') => (typeof v === 'string' ? v.slice(0, max) : def);
  const arr = v => (Array.isArray(v) ? v : []);
  const bool = (v, def = false) => (typeof v === 'boolean' ? v : def);
  const clamp100 = (v, def) => Math.max(0, Math.min(100, num(v, def)));
  /* Timestamps need their own bound: epoch millis are ~1.79e12 and would be crushed by
     the money clamp above, which makes the app think decades elapsed and decay the pet
     on every single load. Upper bound is the max value a JS Date can hold. */
  const ts = (v, def) => {
    const n = typeof v === 'number' ? v : parseFloat(v);
    return (Number.isFinite(n) && n >= 0 && n <= 8.64e15) ? n : def;
  };
  const r2 = n => Math.round(n * 100) / 100;
  const PERIOD_RE = /^\d{4}-(0[1-9]|1[0-2])$/;

  /* Rebuilds a save from defaults, copying across only known keys with valid values.
     A whitelist, so unexpected fields in the file can never reach the app. */
  function sanitize(raw) {
    if (!raw || typeof raw !== 'object' || Array.isArray(raw)) {
      throw new Error('Not a Zeroling save file.');
    }
    if (!Array.isArray(raw.cards)) throw new Error('Not a Zeroling save file.');

    const d = defaults();
    const s = defaults();

    s.created = ts(raw.created, d.created);
    s.lastSeen = ts(raw.lastSeen, Date.now());
    s.onboarded = bool(raw.onboarded);
    s.coins = int(raw.coins, 0);
    s.strategy = raw.strategy === 'snowball' ? 'snowball' : 'avalanche';

    const pet = raw.pet && typeof raw.pet === 'object' ? raw.pet : {};
    s.pet = {
      species: Data.SPECIES_BY_ID[pet.species] ? pet.species : null,
      name: str(pet.name, 20, ''),
      born: ts(pet.born, Date.now()),
    };

    const usedIds = new Set();
    s.cards = arr(raw.cards).slice(0, 60).map(c => {
      if (!c || typeof c !== 'object') return null;
      let id = str(c.id, 24);
      if (!id || usedIds.has(id)) id = uid();
      usedIds.add(id);
      const balance = r2(pos(c.balance, 0));
      return {
        id,
        name: str(c.name, 32) || 'Card',
        balance,
        startBalance: r2(pos(c.startBalance, balance)),
        apr: Math.min(200, pos(c.apr, 0)),
        minPayment: pos(c.minPayment, 0),
        limit: pos(c.limit, 0),
        createdAt: ts(c.createdAt, Date.now()),
        clearedAt: c.clearedAt ? ts(c.clearedAt, null) : null,
      };
    }).filter(Boolean);

    const cardIds = new Set(s.cards.map(c => c.id));
    s.entries = arr(raw.entries).slice(-3000).map(e => {
      if (!e || typeof e !== 'object') return null;
      const cardId = str(e.cardId, 24);
      const period = str(e.period, 7);
      if (!cardIds.has(cardId) || !PERIOD_RE.test(period)) return null;
      return {
        id: str(e.id, 24) || uid(),
        cardId, period,
        at: ts(e.at, Date.now()),
        charges: r2(pos(e.charges, 0)),
        tag: Data.TAG_BY_ID[e.tag] ? e.tag : 'impulse',
        payment: r2(pos(e.payment, 0)),
        interest: r2(pos(e.interest, 0)),
        before: r2(pos(e.before, 0)),
        after: r2(pos(e.after, 0)),
      };
    }).filter(Boolean);

    s.baseline = r2(pos(raw.baseline, s.cards.reduce((a, c) => a + c.startBalance, 0)));

    s.history = arr(raw.history).slice(-400).map(h => (
      h && typeof h === 'object' ? { at: ts(h.at, 0), total: r2(pos(h.total, 0)) } : null
    )).filter(Boolean);

    const v = raw.vitals && typeof raw.vitals === 'object' ? raw.vitals : {};
    s.vitals = {
      health: clamp100(v.health, d.vitals.health),
      happy: clamp100(v.happy, d.vitals.happy),
      energy: clamp100(v.energy, d.vitals.energy),
      at: ts(v.at, Date.now()),
    };

    s.care = {};
    const care = raw.care && typeof raw.care === 'object' ? raw.care : {};
    for (const c of Data.CARE) if (care[c.id] != null) s.care[c.id] = ts(care[c.id], 0);

    const daily = raw.daily && typeof raw.daily === 'object' ? raw.daily : {};
    s.daily = {
      date: str(daily.date, 10),
      done: arr(daily.done).filter(id => Data.TASK_BY_ID[id]).slice(0, 40),
      perfect: bool(daily.perfect),
    };

    const tips = raw.tips && typeof raw.tips === 'object' ? raw.tips : {};
    const tipIds = new Set(Data.TIPS.map(t => t.id));
    s.tips = {
      seen: [...new Set(arr(tips.seen).filter(id => tipIds.has(id)))],
      lastDate: str(tips.lastDate, 10),
    };

    const achIds = new Set(Data.ACHIEVEMENTS.map(a => a.id));
    s.achievements = [...new Set(arr(raw.achievements).filter(id => achIds.has(id)))];

    const shop = raw.shop && typeof raw.shop === 'object' ? raw.shop : {};
    const owned = new Set(arr(shop.owned).filter(id => Data.SHOP_BY_ID[id]));
    owned.add('b-meadow');
    s.shop.owned = [...owned];
    const eq = shop.equipped && typeof shop.equipped === 'object' ? shop.equipped : {};
    for (const slot of ['hat', 'neck', 'bg']) {
      const item = Data.SHOP_BY_ID[eq[slot]];
      s.shop.equipped[slot] = (item && item.slot === slot && owned.has(eq[slot])) ? eq[slot] : d.shop.equipped[slot];
    }

    const stats = raw.stats && typeof raw.stats === 'object' ? raw.stats : {};
    for (const k of Object.keys(d.stats)) s.stats[k] = r2(pos(stats[k], 0));

    const streak = raw.streak && typeof raw.streak === 'object' ? raw.streak : {};
    s.streak = { months: int(streak.months, 0), best: int(streak.best, 0), grace: int(streak.grace, 1) };

    const vis = raw.visits && typeof raw.visits === 'object' ? raw.visits : {};
    s.visits = { streak: int(vis.streak, 0), best: int(vis.best, 0),
                 lastDay: str(vis.lastDay, 10), total: int(vis.total, 0) };

    const set = raw.settings && typeof raw.settings === 'object' ? raw.settings : {};
    s.settings = { extra: pos(set.extra, 0), reduceMotion: bool(set.reduceMotion) };

    return s;
  }

  let s = null;
  let saveBroken = false;

  /* localStorage is sanitized on the way in too — it's editable in devtools and can be
     corrupted by a partial write, and a bad value there reaches exactly the same code paths. */
  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) { s = sanitize(JSON.parse(raw)); return s; }
    } catch (e) {
      console.warn('save load failed, starting fresh', e);
    }
    s = defaults();
    return s;
  }

  function save() {
    if (!s) return false;
    s.lastSeen = Date.now();
    try {
      localStorage.setItem(KEY, JSON.stringify(s));
      saveBroken = false;
      return true;
    } catch (e) {
      // Quota exhausted, private-mode restrictions, storage disabled. Tell someone —
      // silently losing a year of payoff history is the worst possible failure here.
      if (!saveBroken) {
        saveBroken = true;
        window.dispatchEvent(new CustomEvent('zeroling:savefailed', { detail: String(e && e.name || e) }));
      }
      return false;
    }
  }

  function get() { return s || load(); }

  function reset() {
    try { localStorage.removeItem(KEY); } catch (e) { /* ignore */ }
    s = defaults();
    save();
    return s;
  }

  function exportJSON() { return JSON.stringify(s, null, 2); }

  function importJSON(text) {
    if (typeof text !== 'string' || text.length > 8e6) throw new Error('That file is too large to be a save.');
    const parsed = JSON.parse(text);
    const clean = sanitize(parsed);          // throws before anything is written
    s = clean;
    if (!save()) throw new Error('Could not write the imported save to storage.');
    return s;
  }

  return { load, save, get, reset, exportJSON, importJSON, sanitize, uid, KEY,
           get saveBroken() { return saveBroken; } };
})();


/* ===== js/game.js ===== */
/* Zeroling — game rules. Owns every mutation of state; the UI only calls in here. */
const Game = (() => {
  const DAY = 86400e3;
  const MAX_MONEY = 1e9;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const s = () => State.get();
  /* Money coming in from a form, an import or a caller is never trusted to be a finite
     number — one Infinity or NaN in a balance poisons every projection downstream. */
  const cash = (v, def = 0) => {
    const n = typeof v === 'number' ? v : parseFloat(v);
    return Number.isFinite(n) ? Math.max(0, Math.min(MAX_MONEY, n)) : def;
  };

  function dayKey(d = new Date()) {
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }

  const DAY_RE = /^\d{4}-\d{2}-\d{2}$/;
  function dayStamp(k) {
    if (!DAY_RE.test(k || '')) return null;
    const [y, m, d] = k.split('-').map(Number);
    return new Date(y, m - 1, d).getTime();
  }
  function daysBetween(a, b) {
    const A = dayStamp(a), B = dayStamp(b);
    return (A == null || B == null) ? null : Math.round((B - A) / DAY);
  }

  /* Daily check-in. This is the strongest reason to open the app on a day when there is
     nothing to log, so the reward is never withheld — not even while the pet is unwell. */
  function checkIn() {
    const st = s();
    const today = dayKey();
    if (st.visits.lastDay === today) return null;
    const prev = st.visits.lastDay;
    const gap = daysBetween(prev, today);
    st.visits.streak = gap === 1 ? st.visits.streak + 1 : 1;
    st.visits.best = Math.max(st.visits.best || 0, st.visits.streak);
    st.visits.total = (st.visits.total || 0) + 1;
    st.visits.lastDay = today;
    const coins = 5 + Math.min(25, st.visits.streak * 2);
    st.coins += coins;
    const unlocked = checkAchievements();
    State.save();
    return { streak: st.visits.streak, coins, unlocked, first: !prev,
             daysAway: gap, broke: !!prev && gap !== 1 };
  }

  /* Care, tasks and payments can all pull the pet out of illness — record it wherever it
     happens so the "nursed back" achievement cannot be missed. */
  function noteRecovery(wasSick) {
    const st = s();
    if (wasSick && !isSick()) { st.stats.recoveries = (st.stats.recoveries || 0) + 1; return true; }
    return false;
  }

  /* ---------------- derived numbers ---------------- */
  const activeCards = () => s().cards.filter(c => c.balance > 0.005);
  const totalDebt   = () => Finance.total(s().cards);

  function avgAPR() {
    const cards = activeCards();
    const tot = cards.reduce((a, c) => a + c.balance, 0);
    if (!tot) return 0;
    return cards.reduce((a, c) => a + c.balance * (Number(c.apr) || 0), 0) / tot;
  }

  /* % of the starting total that has been eliminated. */
  function pctPaid() {
    const st = s();
    if (!st.baseline || st.baseline <= 0) return 0;
    return clamp((1 - totalDebt() / st.baseline) * 100, 0, 100);
  }

  const trueStage = () => Data.stageFor(pctPaid());

  /* Strict-but-recoverable: a sick pet visibly regresses one stage until it recovers. */
  function stage() {
    const st = trueStage();
    if (!isSick()) return st;
    return Data.STAGES[Math.max(0, st.id - 1)];
  }

  function vitality() {
    const v = s().vitals;
    return v.health * 0.5 + v.happy * 0.25 + v.energy * 0.25;
  }

  const isSick = () => s().vitals.health < 25 || vitality() < 25;

  /* Health sets the ceiling: a well-fed, well-played-with pet still can't look thriving
     while the debt is going the wrong way. Otherwise the care buttons would paper over a bad month. */
  function mood() {
    if (isSick()) return 'sick';
    const RANK = ['low', 'ok', 'happy'];
    const h = s().vitals.health, v = vitality();
    const byHealth = h >= 70 ? 2 : h >= 50 ? 1 : 0;
    const byVitals = v >= 70 ? 2 : v >= 45 ? 1 : 0;
    return RANK[Math.min(byHealth, byVitals)];
  }

  /* Interest eats the pet: high APR starves it faster, normalised so it works at any debt size. */
  function drainPerDay() {
    if (!activeCards().length) return 2;
    return 4 + clamp(avgAPR() * 0.5, 0, 14);
  }

  /* ---------------- time ---------------- */
  function tick() {
    const st = s();
    const now = Date.now();
    const elapsed = Math.min(now - (st.vitals.at || now), 5 * DAY);  // cap so a long break isn't fatal
    if (elapsed < 60e3) return false;
    const days = elapsed / DAY;

    st.vitals.energy = clamp(st.vitals.energy - drainPerDay() * days, 0, 100);
    st.vitals.happy  = clamp(st.vitals.happy - 12 * days, 0, 100);
    if (st.vitals.energy < 20 || st.vitals.happy < 20) {
      st.vitals.health = clamp(st.vitals.health - 2 * days, 0, 100);
    }
    st.vitals.at = now;
    rolloverDay();
    State.save();
    return true;
  }

  function rolloverDay() {
    const st = s();
    const k = dayKey();
    if (st.daily.date !== k) { st.daily.date = k; st.daily.done = []; st.daily.perfect = false; }
  }

  /* ---------------- coins ---------------- */
  function earn(n, opts = {}) {
    const st = s();
    let amt = Math.round(n);
    if (isSick()) {
      if (opts.debt) return 0;            // progress rewards are withheld until it recovers
      amt = Math.round(amt * 0.5);
    }
    st.coins += amt;
    return amt;
  }

  /* ---------------- cards ---------------- */
  function addCard({ name, balance, apr, minPayment, limit }) {
    const st = s();
    const bal = cash(balance);
    const card = {
      id: State.uid(),
      name: String(name == null ? '' : name).trim().slice(0, 32) || 'Card',
      balance: Finance.round2(bal),
      startBalance: Finance.round2(bal),
      apr: Math.min(200, cash(apr)),
      minPayment: cash(minPayment),
      limit: cash(limit),
      createdAt: Date.now(),
    };
    st.cards.push(card);
    st.baseline = Finance.round2(st.baseline + bal);   // new cards extend the baseline, not your progress
    snapshot();
    State.save();
    return card;
  }

  function editCard(id, patch) {
    const st = s();
    const c = st.cards.find(x => x.id === id);
    if (!c) return null;
    if (patch.name != null) c.name = String(patch.name).trim().slice(0, 32) || c.name;
    if (patch.apr != null) c.apr = Math.min(200, cash(patch.apr, c.apr));
    if (patch.minPayment != null) c.minPayment = cash(patch.minPayment, c.minPayment);
    if (patch.limit != null) c.limit = cash(patch.limit, c.limit);
    if (patch.balance != null) {
      // A manual balance correction shifts the baseline too, so it can't be gamed into fake progress.
      const nb = cash(patch.balance, c.balance);
      st.baseline = Finance.round2(st.baseline + (nb - c.balance));
      c.balance = Finance.round2(nb);
    }
    snapshot();
    State.save();
    return c;
  }

  function removeCard(id) {
    const st = s();
    const c = st.cards.find(x => x.id === id);
    if (!c) return;
    st.baseline = Finance.round2(Math.max(0, st.baseline - c.balance));
    st.cards = st.cards.filter(x => x.id !== id);
    st.entries = st.entries.filter(e => e.cardId !== id);
    snapshot();
    State.save();
  }

  function snapshot() {
    const st = s();
    const t = totalDebt();
    const last = st.history[st.history.length - 1];
    const now = Date.now();
    if (last && now - last.at < 60e3) { last.total = t; return; }
    st.history.push({ at: now, total: t });
    if (st.history.length > 400) st.history = st.history.slice(-400);
  }

  /* ---------------- the core action: log a month ---------------- */
  /**
   * charges  — new money put ON the card this period
   * tag      — why (scales the punishment)
   * payment  — money paid toward the card
   * interest — optional override; otherwise estimated from APR
   */
  function logMonth(cardId, { charges = 0, tag = 'impulse', payment = 0, interest = null, period = null }) {
    const st = s();
    const c = st.cards.find(x => x.id === cardId);
    if (!c) return null;

    const p = /^\d{4}-(0[1-9]|1[0-2])$/.test(period || '') ? period : Finance.periodKey();
    const ch = cash(charges);
    const pay = cash(payment);
    const before = c.balance;
    const int = interest == null ? Finance.estInterest(before, c.apr) : cash(interest);
    const after = Finance.round2(Math.max(0, before + ch + int - pay));
    const net = Finance.round2(after - before);

    const entry = {
      id: State.uid(), cardId, period: p, at: Date.now(),
      charges: ch, tag, payment: pay, interest: int, before, after,
    };
    st.entries.push(entry);
    c.balance = after;
    if (after <= 0.005 && !c.clearedAt) c.clearedAt = Date.now();
    if (after > 0.005) c.clearedAt = null;

    st.stats.monthsLogged++;
    st.stats.paidTotal = Finance.round2(st.stats.paidTotal + pay);
    st.stats.chargedTotal = Finance.round2(st.stats.chargedTotal + ch);
    st.stats.interestTotal = Finance.round2(st.stats.interestTotal + int);

    // ---- consequences ----
    const mult = (Data.TAG_BY_ID[tag] || { mult: 1 }).mult;
    const pct = Math.abs(net) / Math.max(before, 1);
    let dHealth, dHappy;
    if (net < 0) {
      dHealth = clamp(5 + pct * 80, 5, 20);
      dHappy = 8;
    } else if (net > 0) {
      dHealth = -clamp(4 + pct * 120, 4, 26) * mult;
      dHappy = -clamp(6 + pct * 40, 6, 18) * mult;
    } else {
      dHealth = 0; dHappy = 0;
    }

    // Payments feed the pet — the more the payment outruns the interest, the better it eats.
    const feedRatio = pay / Math.max(1, int);
    const dEnergy = pay > 0 ? clamp(6 + feedRatio * 4, 6, 34) : -4;

    const wasSick = isSick();
    st.vitals.health = clamp(st.vitals.health + dHealth, 0, 100);
    st.vitals.happy  = clamp(st.vitals.happy + dHappy, 0, 100);
    st.vitals.energy = clamp(st.vitals.energy + dEnergy, 0, 100);
    st.vitals.at = Date.now();

    recomputeStreak();
    const recovered = noteRecovery(wasSick);

    let coins = earn(25);                                     // showing up counts
    if (net < 0) coins += earn(Math.min(200, Math.floor(-net / 10)), { debt: true });
    if (st.streak.months > 1) coins += earn(Math.min(100, st.streak.months * 5), { debt: true });

    snapshot();
    const unlocked = checkAchievements();
    State.save();

    return {
      entry, net, coins, dHealth: Math.round(dHealth), dEnergy: Math.round(dEnergy),
      cleared: after <= 0.005 && before > 0.005,
      card: c, unlocked, recovered, becameSick: !wasSick && isSick(),
    };
  }

  /* Trailing run of consecutive periods whose net change was negative.
     Recomputed from entries so it survives edits and can't drift. */
  function recomputeStreak() {
    const st = s();
    const nets = {};
    for (const e of st.entries) nets[e.period] = (nets[e.period] || 0) + (e.after - e.before);
    const periods = Object.keys(nets).sort();
    let run = 0, best = 0;
    for (const p of periods) {
      if (nets[p] < -0.005) { run++; best = Math.max(best, run); } else { run = 0; }
    }
    st.streak.months = run;
    st.streak.best = Math.max(st.streak.best || 0, best);
    return run;
  }

  function periodNets() {
    const nets = {};
    for (const e of s().entries) nets[e.period] = (nets[e.period] || 0) + (e.after - e.before);
    return nets;
  }

  /* Which cards still need logging this period. Cleared cards drop out — nagging someone
     every month to log a card they already paid off is the opposite of the point. */
  function pendingThisPeriod(period = Finance.periodKey()) {
    const logged = new Set(s().entries.filter(e => e.period === period).map(e => e.cardId));
    return s().cards.filter(c => !logged.has(c.id) && c.balance > 0.005);
  }

  /* Total debt at the end of each logged period, rebuilt from the entries.
     The chart is keyed on the month being reported, not on when the user happened to type it in —
     otherwise catching up on a backlog in one sitting collapses into a single point. */
  function debtSeries() {
    const st = s();
    if (!st.cards.length) return [];
    const periods = [...new Set(st.entries.map(e => e.period))].sort();
    const bal = {};
    for (const c of st.cards) bal[c.id] = c.startBalance;
    const sum = () => Finance.round2(Object.values(bal).reduce((a, b) => a + b, 0));
    const series = [{ period: null, label: 'Start', total: sum() }];
    for (const p of periods) {
      for (const e of st.entries) if (e.period === p) bal[e.cardId] = e.after;
      series.push({ period: p, label: p, total: sum() });
    }
    return series;
  }

  /* ---------------- care + daily tasks ---------------- */
  function careReady(id) {
    const c = Data.CARE.find(x => x.id === id);
    if (!c) return false;
    const last = s().care[id] || 0;
    return Date.now() - last >= c.cd;
  }

  function careCooldownLeft(id) {
    const c = Data.CARE.find(x => x.id === id);
    if (!c) return 0;
    return Math.max(0, c.cd - (Date.now() - (s().care[id] || 0)));
  }

  function doCare(id) {
    const st = s();
    const c = Data.CARE.find(x => x.id === id);
    if (!c || !careReady(id)) return null;
    const wasSick = isSick();
    st.care[id] = Date.now();
    st.vitals.energy = clamp(st.vitals.energy + (c.energy || 0), 0, 100);
    st.vitals.happy  = clamp(st.vitals.happy + (c.happy || 0), 0, 100);
    st.vitals.health = clamp(st.vitals.health + (c.health || 0), 0, 100);
    st.vitals.at = Date.now();
    const coins = earn(c.coins || 0);
    const recovered = noteRecovery(wasSick);
    State.save();
    return { care: c, coins, recovered };
  }

  function todaysTasks() {
    rolloverDay();
    return Data.tasksFor(s().daily.date || dayKey());
  }

  function taskDone(id) { return s().daily.done.includes(id); }

  function completeTask(id) {
    const st = s();
    rolloverDay();
    if (st.daily.done.includes(id)) return null;
    const t = Data.TASK_BY_ID[id];
    if (!t) return null;
    const wasSick = isSick();
    st.daily.done.push(id);
    st.stats.tasksDone++;
    st.vitals.happy = clamp(st.vitals.happy + 7, 0, 100);
    st.vitals.energy = clamp(st.vitals.energy + 3, 0, 100);
    st.vitals.at = Date.now();
    const coins = earn(t.coins);
    let perfect = false;
    if (!st.daily.perfect && todaysTasks().every(x => st.daily.done.includes(x.id))) {
      st.daily.perfect = true;
      st.stats.perfectDays = (st.stats.perfectDays || 0) + 1;
      perfect = true;
    }
    const recovered = noteRecovery(wasSick);
    const unlocked = checkAchievements();
    State.save();
    return { task: t, coins, unlocked, perfect, recovered };
  }

  /* ---------------- tips ---------------- */
  function todaysTip() {
    rolloverDay();
    return Data.tipFor(s().daily.date || dayKey(), s().tips.seen);
  }

  function markTipSeen(id) {
    const st = s();
    if (!st.tips.seen.includes(id)) {
      st.tips.seen.push(id);
      checkAchievements();
      State.save();
    }
  }

  /* ---------------- shop ---------------- */
  function owned(id) { return s().shop.owned.includes(id); }

  function locked(item) {
    return item.req ? !s().achievements.includes(item.req) : false;
  }

  function buy(id) {
    const st = s();
    const item = Data.SHOP_BY_ID[id];
    if (!item || owned(id) || locked(item)) return null;
    if (st.coins < item.cost) return null;
    st.coins -= item.cost;
    st.shop.owned.push(id);
    equip(id);
    const unlocked = checkAchievements();
    State.save();
    return { item, unlocked };
  }

  function equip(id) {
    const st = s();
    const item = Data.SHOP_BY_ID[id];
    if (!item || !owned(id)) return;
    st.shop.equipped[item.slot] = st.shop.equipped[item.slot] === id ? (item.slot === 'bg' ? 'b-meadow' : null) : id;
    State.save();
  }

  function equippedItem(slot) {
    const id = s().shop.equipped[slot];
    return id ? Data.SHOP_BY_ID[id] : null;
  }

  /* ---------------- achievements ---------------- */
  function clearedCount() {
    return s().cards.filter(c => c.startBalance > 0 && c.balance <= 0.005).length;
  }

  function cleanMonthRun() {
    const st = s();
    const byPeriod = {};
    for (const e of st.entries) {
      byPeriod[e.period] = byPeriod[e.period] || { charges: 0 };
      byPeriod[e.period].charges += e.charges;
    }
    const periods = Object.keys(byPeriod).sort();
    let run = 0;
    for (const p of periods) run = byPeriod[p].charges <= 0.005 ? run + 1 : 0;
    return run;
  }

  const COND = {
    'first-log':     st => st.stats.monthsLogged >= 1,
    'first-down':    st => st.entries.some(e => e.after < e.before),
    'first-card':    () => clearedCount() >= 1,
    'two-cards':     () => clearedCount() >= 2,
    'debt-free':     st => st.baseline > 0 && totalDebt() <= 0.005 && st.cards.length > 0,
    'streak-3':      st => st.streak.best >= 3,
    'streak-6':      st => st.streak.best >= 6,
    'streak-12':     st => st.streak.best >= 12,
    'pct-10':        () => pctPaid() >= 10,
    'pct-25':        () => pctPaid() >= 25,
    'pct-50':        () => pctPaid() >= 50,
    'pct-75':        () => pctPaid() >= 75,
    'tasks-25':      st => st.stats.tasksDone >= 25,
    'tasks-100':     st => st.stats.tasksDone >= 100,
    'no-charge':     st => st.entries.length > 0 && Object.values(
                             st.entries.reduce((m, e) => { m[e.period] = (m[e.period] || 0) + e.charges; return m; }, {})
                           ).some(v => v <= 0.005),
    'no-charge-3':   () => cleanMonthRun() >= 3,
    'big-payment':   st => st.entries.some(e => e.payment >= 1000),
    'interest-beat': st => st.entries.some(e => e.interest > 0 && e.payment > e.interest * 3),
    'tip-reader':    st => st.tips.seen.length >= 15,
    'dressed-up':    st => st.shop.owned.filter(id => id !== 'b-meadow').length >= 1,
    'visit-3':       st => (st.visits.best || 0) >= 3,
    'visit-7':       st => (st.visits.best || 0) >= 7,
    'visit-30':      st => (st.visits.best || 0) >= 30,
    'perfect-day':   st => (st.stats.perfectDays || 0) >= 1,
    'perfect-7':     st => (st.stats.perfectDays || 0) >= 7,
    'comeback':      st => (st.stats.recoveries || 0) >= 1,
    'halve-card':    st => st.cards.some(c => c.startBalance > 0 && c.balance <= c.startBalance / 2),
    'multi-payment': st => {
      const seen = {};
      for (const e of st.entries) {
        if (e.payment <= 0) continue;
        const k = e.cardId + '|' + e.period;
        if ((seen[k] = (seen[k] || 0) + 1) >= 2) return true;
      }
      return false;
    },
    'no-interest':   st => st.entries.some(e => e.interest <= 0.005 && e.payment > 0),
    'early-log':     st => st.entries.some(e => new Date(e.at).getDate() <= 5),
    'all-cards':     st => {
      if (st.cards.length < 2) return false;
      const byPeriod = {};
      for (const e of st.entries) (byPeriod[e.period] = byPeriod[e.period] || new Set()).add(e.cardId);
      return Object.values(byPeriod).some(set => set.size >= st.cards.length);
    },
    'paid-1k':       st => st.stats.paidTotal >= 1000,
    'paid-10k':      st => st.stats.paidTotal >= 10000,
    'collector':     st => st.shop.owned.filter(id => id !== 'b-meadow').length >= 5,
    'decorator':     st => st.shop.owned.filter(id => (Data.SHOP_BY_ID[id] || {}).slot === 'bg').length >= 5,
    'tip-all':       st => st.tips.seen.length >= Data.TIPS.length,
  };

  function checkAchievements() {
    const st = s();
    const newly = [];
    for (const a of Data.ACHIEVEMENTS) {
      if (st.achievements.includes(a.id)) continue;
      const fn = COND[a.id];
      if (fn && fn(st)) {
        st.achievements.push(a.id);
        st.coins += a.coins;              // achievement payouts are never withheld
        newly.push(a);
      }
    }
    return newly;
  }

  /* ---------------- setup ---------------- */
  function startGame(speciesId, petName) {
    const st = s();
    st.pet.species = speciesId;
    st.pet.name = (petName || 'Zeroling').trim().slice(0, 20);
    st.pet.born = Date.now();
    st.onboarded = true;
    st.baseline = totalDebt();
    st.vitals.at = Date.now();
    snapshot();
    State.save();
  }

  function species() {
    return Data.SPECIES_BY_ID[s().pet.species] || Data.SPECIES[0];
  }

  function init() {
    State.load();
    rolloverDay();
    tick();
    return s();
  }

  return {
    init, tick, dayKey, dayStamp, daysBetween, checkIn, s,
    activeCards, totalDebt, avgAPR, pctPaid, trueStage, stage, mood, vitality, isSick, drainPerDay,
    addCard, editCard, removeCard, logMonth, pendingThisPeriod, periodNets, recomputeStreak,
    careReady, careCooldownLeft, doCare, todaysTasks, taskDone, completeTask,
    todaysTip, markTipSeen,
    owned, locked, buy, equip, equippedItem,
    clearedCount, checkAchievements, startGame, species, snapshot, earn, debtSeries,
  };
})();

     whatever is still outstanding. Retention without nagging. */
  function todayCard() {
    const st = Game.s();
    const v = st.visits;
    const nextBonus = 5 + Math.min(25, (v.streak + 1) * 2);
    const pending = Game.pendingThisPeriod();
    const tasksLeft = Game.todaysTasks().filter(t => !Game.taskDone(t.id));

    });
    if (careLeft) todo.push({
      icon: '🍎', act: null,

  function screenPlan() {
    const st = Game.s();

    const cmp = Finance.compare(cards, planExtra);
    const chosen = st.strategy === 'snowball' ? cmp.snowball : cmp.avalanche;
    const wi = Finance.whatIf(cards, st.strategy, planExtra);

    const date = Finance.payoffDate(chosen.months);
    const order = Finance.orderFor(cards, st.strategy);

    return `

        <div class="stats">
          <div class="stat good"><b>${Finance.monthsText(chosen.months)}</b><span>until debt free</span></div>

          <div class="stat warn"><b>${money(chosen.totalInterest)}</b><span>interest you'll pay</span></div>

        ${planExtra > 0 && wi.monthsSaved != null && wi.monthsSaved > 0 ? `

            <b style="color:var(--good)">${wi.monthsSaved} month${wi.monthsSaved === 1 ? '' : 's'} sooner</b>
            and saves <b style="color:var(--good)">${money(wi.interestSaved)}</b> in interest.</div>
        ` : `<div class="hr"></div><div class="small muted">Drag the slider to see what even $25 more a month does.</div>`}

        <h2 class="sec">Avalanche vs snowball</h2>

          <div class="stat ${cmp.recommend === 'avalanche' ? 'good' : ''}">
            <b>${Finance.monthsText(cmp.avalanche.months)}</b><span>Avalanche · ${money(cmp.avalanche.totalInterest)} interest</span></div>

          const p = chosen.payoffs.find(x => x.id === c.id);

  /* ---------------- history chart ---------------- */
  function drawChart(canvas) {
    const pts = Game.debtSeries().slice(-120);
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = canvas.clientWidth, h = canvas.clientHeight;
    canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);

    if (pts.length < 2) {
      ctx.fillStyle = '#6c7a8c'; ctx.font = '13px system-ui'; ctx.textAlign = 'center';
      ctx.fillText('Log a month or two and the trend shows up here.', w / 2, h / 2);
      return;
    }

    const pad = { l: 46, r: 10, t: 12, b: 20 };
    const max = Math.max(...pts.map(p => p.total)) * 1.08 || 1;
    const min = 0;
    const X = i => pad.l + (i / (pts.length - 1)) * (w - pad.l - pad.r);
    const Y = v => pad.t + (1 - (v - min) / (max - min)) * (h - pad.t - pad.b);

    // gridlines
    ctx.strokeStyle = '#2b3441'; ctx.lineWidth = 1;
    ctx.fillStyle = '#6c7a8c'; ctx.font = '10px system-ui'; ctx.textAlign = 'right';
    for (let i = 0; i <= 3; i++) {
      const v = min + (max - min) * (i / 3), y = Y(v);
      ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(w - pad.r, y); ctx.stroke();
      ctx.fillText(money(v), pad.l - 6, y + 3);
    }

    // area + line
    const grad = ctx.createLinearGradient(0, pad.t, 0, h - pad.b);
    grad.addColorStop(0, 'rgba(95,211,160,.34)'); grad.addColorStop(1, 'rgba(95,211,160,0)');
    ctx.beginPath();
    pts.forEach((p, i) => i ? ctx.lineTo(X(i), Y(p.total)) : ctx.moveTo(X(i), Y(p.total)));
    ctx.lineTo(X(pts.length - 1), h - pad.b); ctx.lineTo(X(0), h - pad.b); ctx.closePath();
    ctx.fillStyle = grad; ctx.fill();

    ctx.beginPath();
    pts.forEach((p, i) => i ? ctx.lineTo(X(i), Y(p.total)) : ctx.moveTo(X(i), Y(p.total)));
    ctx.strokeStyle = '#5fd3a0'; ctx.lineWidth = 2.2; ctx.lineJoin = 'round'; ctx.stroke();

    const last = pts[pts.length - 1];
    ctx.fillStyle = '#5fd3a0';
    ctx.beginPath(); ctx.arc(X(pts.length - 1), Y(last.total), 3.6, 0, 7); ctx.fill();

    const lbl = p => (p.period ? Finance.periodLabel(p.period).replace(/(\w{3})\w* (\d{4})/, '$1 $2') : p.label);
    ctx.fillStyle = '#6c7a8c'; ctx.font = '10px system-ui'; ctx.textAlign = 'left';
    ctx.fillText(lbl(pts[0]), pad.l, h - 6);
    ctx.textAlign = 'right';
    ctx.fillText(lbl(last), w - pad.r, h - 6);
  }

  /* ---------------- pet animation loop ---------------- */
  function startPetLoop() {
    cancelAnimationFrame(rafId);
    const canvas = $('#petcanvas');
    if (!canvas) return;
    const st = Game.s();
    const reduce = st.settings.reduceMotion ||
      window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const bg = st.shop.equipped.bg || 'b-meadow';
    const hat = Game.equippedItem('hat');
    const neck = Game.equippedItem('neck');
    const opts = {
      species: Game.species(), mood: Game.mood(), scale: Game.stage().scale,
      bg, hat, neck, t: 0.4,
    };
    if (reduce) { Art.render(canvas, opts); return; }
    let t0 = null;
    const frame = ts => {
      if (t0 === null) t0 = ts;
      opts.t = (ts - t0) / 1000;
      Art.render(canvas, opts);
      rafId = requestAnimationFrame(frame);
    };
    Art.render(canvas, opts);                        // paint once in case rAF is throttled
    rafId = requestAnimationFrame(frame);
  }
