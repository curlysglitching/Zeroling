ffff%22%20opacity%3D%22.9%22%2F%3E%20%3Cellipse%20cx%3D%22256%22%20cy%3D%22254%22%20rx%3D%229%22%20ry%3D%227%22%20fill%3D%22%232b1a15%22%2F%3E%20%3C%2Fsvg%3E">

<style>
/* Zeroling — mobile-first, dark, cozy. */
:root{
  --bg:#14181f; --panel:#1b212b; --panel2:#232b37; --panel3:#2b3543;
  --line:#303b4a; --ink:#e9eef5; --dim:#93a2b5; --dimmer:#6c7a8c;
  --good:#5fd3a0; --warn:#f0a44a; --bad:#e2706d; --coin:#f2c14e; --info:#6fb4e8;
  --r:14px; --shadow:0 6px 20px rgba(0,0,0,.35);
  --safe-b: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:15px/1.5 ui-rounded,-apple-system,"Segoe UI Variable","Segoe UI",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased; overscroll-behavior-y:none;
}
#app{max-width:540px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}

/* ---------- top bar ---------- */
#topbar{
  display:flex;align-items:center;gap:8px;padding:10px 12px;
  background:linear-gradient(#1b212b,#171c25);border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:20;
}
.pill{
  display:inline-flex;align-items:center;gap:5px;font-weight:700;font-size:13px;
  background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:5px 11px;white-space:nowrap;
}
.pill.coin{color:var(--coin)} .pill.streak{color:var(--warn)}
#topbar .grow{flex:1;text-align:center;min-width:0}
#topbar .grow b{display:block;font-size:14px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#topbar .grow span{font-size:11px;color:var(--dim)}
.icon-btn{
  background:var(--panel2);border:1px solid var(--line);color:var(--ink);
  width:34px;height:34px;border-radius:10px;font-size:16px;cursor:pointer;flex:none;
}

/* ---------- layout ---------- */
#screen{flex:1;padding:14px 12px calc(84px + var(--safe-b));min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card.tight{padding:11px}
h2.sec{font-size:12px;letter-spacing:.9px;text-transform:uppercase;color:var(--dim);margin:0 0 9px;font-weight:800}
.muted{color:var(--dim)} .small{font-size:12.5px} .tiny{font-size:11.5px}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.spacer{flex:1}
.hr{height:1px;background:var(--line);margin:11px -14px}

/* ---------- buttons ---------- */
button{font:inherit}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  background:var(--panel2);color:var(--ink);border:1px solid var(--line);
  border-radius:11px;padding:10px 14px;font-size:14px;font-weight:600;cursor:pointer;transition:.14s;
}
.btn:active{transform:translateY(1px)}
.btn:hover:not(:disabled){border-color:#41506380}
.btn.primary{background:var(--good);color:#0e1a15;border-color:var(--good)}
.btn.danger{background:transparent;color:var(--bad);border-color:#5a3a3a}
.btn.wide{width:100%}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:9px}

/* ---------- pet scene ---------- */
.scene{
  position:relative;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);
  background:var(--panel2);margin-bottom:12px;
}
.scene canvas{display:block;width:100%;aspect-ratio:1/.86;object-fit:cover}
.scene .nameplate{
  position:absolute;left:10px;top:10px;background:rgba(12,16,22,.62);backdrop-filter:blur(6px);
  border-radius:10px;padding:5px 10px;font-size:13px;font-weight:700;
}
.scene .nameplate span{display:block;font-size:10.5px;font-weight:600;color:#cfe0ee;opacity:.9}
.scene .statuschip{
  position:absolute;right:10px;top:10px;background:rgba(12,16,22,.62);backdrop-filter:blur(6px);
  border-radius:999px;padding:5px 11px;font-size:11.5px;font-weight:700;
}
.statuschip.sick{background:rgba(120,32,32,.72);color:#ffd9d6}
.statuschip.happy{background:rgba(20,78,56,.72);color:#c6ffe6}

/* vitals */
.vitals{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.vital{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 10px}
.vital .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--dim);font-weight:800;display:flex;gap:4px;align-items:center}
.bar{height:7px;border-radius:99px;background:#2b3441;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:99px;transition:width .4s ease}
.bar.health i{background:linear-gradient(90deg,#e2706d,#5fd3a0)}
.bar.happy i{background:linear-gradient(90deg,#f0a44a,#f2d24e)}
.bar.energy i{background:linear-gradient(90deg,#6fb4e8,#5fd3a0)}

/* care buttons */
.care{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.care button{
  background:var(--panel2);border:1px solid var(--line);border-radius:12px;color:var(--ink);
  padding:10px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;
}
.care button .ico{font-size:20px;line-height:1}
.care button:disabled{opacity:.4}
.care button .cd{font-size:10px;color:var(--dim);font-weight:600}

/* ---------- progress ---------- */
.bigprog{margin-bottom:10px}
.bigprog .nums{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px}
.bigprog .nums b{font-size:26px;letter-spacing:-.5px}
.bigprog .nums .of{font-size:12.5px;color:var(--dim)}
.track{height:12px;border-radius:99px;background:#2b3441;overflow:hidden;position:relative}
.track i{display:block;height:100%;background:linear-gradient(90deg,#3fa87a,#5fd3a0);border-radius:99px;transition:width .5s}
.track .ticks{position:absolute;inset:0;display:flex}
.track .ticks u{flex:1;border-right:1px solid rgba(255,255,255,.10)}
.track .ticks u:last-child{border:0}

/* ---------- lists ---------- */
.item{
  display:flex;align-items:center;gap:11px;padding:11px;border:1px solid var(--line);
  border-radius:12px;background:var(--panel2);margin-bottom:8px;
}
.item:last-child{margin-bottom:0}
.item .ico{font-size:19px;flex:none;width:26px;text-align:center}
.item .body{flex:1;min-width:0}
.item .body b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .body .sub{font-size:12px;color:var(--dim)}
.item .val{text-align:right;flex:none;font-weight:700;font-size:14px}
.item .val .sub{font-size:11px;color:var(--dim);font-weight:600}
.item.done{opacity:.5}
.item.done .body b{text-decoration:line-through}
.item.clickable{cursor:pointer}
.item.clickable:active{background:var(--panel3)}
.item.focus{border-color:#3f6d58;background:linear-gradient(var(--panel2),#1e2c27)}
.item.cleared{border-color:#3f6d58}
.item.cleared .val{color:var(--good)}

.checkbox{
  width:24px;height:24px;border-radius:8px;border:2px solid var(--line);flex:none;
  display:grid;place-items:center;font-size:13px;color:transparent;background:transparent;cursor:pointer;
}
.item.done .checkbox{background:var(--good);border-color:var(--good);color:#0e1a15}

/* ---------- forms ---------- */
label.f{display:block;margin-bottom:11px}
label.f > span{display:block;font-size:12px;color:var(--dim);margin-bottom:5px;font-weight:600}
label.f > span em{font-style:normal;color:var(--dimmer);font-weight:500}
input[type=text],input[type=number],select{
  width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:11px;
  color:var(--ink);padding:11px 12px;font:inherit;font-size:16px; /* 16px stops iOS zoom-on-focus */
}
input:focus,select:focus{outline:2px solid #3f6d58;outline-offset:0;border-color:transparent}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input[type=range]{width:100%;accent-color:var(--good)}

.seg{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px}
.seg button{
  flex:1;background:transparent;border:0;color:var(--dim);padding:8px 6px;border-radius:9px;
  font-size:13px;font-weight:700;cursor:pointer;
}
.seg button.on{background:var(--good);color:#0e1a15}

.tagpick{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}
.tagpick button{
  background:var(--panel2);border:1px solid var(--line);border-radius:11px;color:var(--ink);
  padding:9px;font-size:12.5px;font-weight:600;cursor:pointer;text-align:left;
}
.tagpick button.on{border-color:var(--good);background:#1e2c27}
.tagpick button .t{display:block;font-size:10.5px;color:var(--dim);font-weight:500;margin-top:2px;line-height:1.3}

/* ---------- tip ---------- */
.tip{background:linear-gradient(#232b37,#1d2530);border:1px solid #3a4757;border-radius:var(--r);padding:14px;margin-bottom:12px}
.tip .cat{font-size:10.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--info);font-weight:800}
.tip h3{margin:4px 0 6px;font-size:15.5px}
.tip p{margin:0;font-size:13.5px;color:#c3d0de;line-height:1.55}

/* ---------- chart ---------- */
.chartbox{position:relative;height:170px;margin:6px -4px 0}
.chartbox canvas{width:100%;height:100%;display:block}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--dim);margin-top:8px;flex-wrap:wrap}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* ---------- stat grid ---------- */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:11px}
.stat b{display:block;font-size:19px;letter-spacing:-.3px}
.stat span{font-size:11.5px;color:var(--dim)}
.stat.wide{grid-column:1/-1}
.stat.good b{color:var(--good)} .stat.bad b{color:var(--bad)} .stat.warn b{color:var(--warn)}

/* ---------- shop ---------- */
.shopgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.shopitem .thumb{width:100%;max-width:128px;aspect-ratio:1;border-radius:11px;display:block;
  margin:0 auto 7px;background:#1c232d;border:1px solid var(--line)}
.shopitem .lockmsg{font-size:10.5px;color:var(--warn);margin-top:5px;line-height:1.35}
.shopitem .cost.short{color:var(--dim)}
.shopitem{
  background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:9px 6px;
  text-align:center;cursor:pointer;position:relative;
}
.shopitem .sw{width:34px;height:34px;border-radius:10px;margin:0 auto 6px;border:2px solid rgba(255,255,255,.16)}
.shopitem b{display:block;font-size:11.5px;font-weight:700;line-height:1.25}
.shopitem .cost{font-size:11px;color:var(--coin);font-weight:700;margin-top:3px}
.shopitem.owned{border-color:#3f6d58}
.shopitem.on{border-color:var(--good);background:#1e2c27}
.shopitem.locked{opacity:.74}
.shopitem .badge{position:absolute;top:5px;right:6px;font-size:11px}

/* ---------- today / streak card ---------- */
.todaycard{border-color:#4a4230;background:linear-gradient(var(--panel),#221f18)}
.streakbig{font-size:23px;font-weight:800;color:var(--warn);flex:none;letter-spacing:-.5px}
.todo{display:flex;align-items:center;gap:9px;padding:7px 0}
.todo + .todo{border-top:1px solid var(--line)}
.todo .ico{font-size:16px;flex:none;width:20px;text-align:center}
.todo .cta{font-size:12px;font-weight:700;color:var(--good);flex:none}
.todo.clickable{cursor:pointer}
.todo.clickable:active{opacity:.6}

/* ---------- achievements ---------- */
.achv{display:flex;gap:10px;align-items:center;padding:9px 0}
.achv + .achv{border-top:1px solid var(--line)}
.achv .ico{font-size:20px;width:28px;text-align:center;flex:none;filter:grayscale(1);opacity:.35}
.achv.got .ico{filter:none;opacity:1}
.achv .body b{font-size:13.5px} .achv .body div{font-size:11.5px;color:var(--dim)}
.achv .got-mark{color:var(--good);font-weight:800;font-size:12px}

/* ---------- tabbar ---------- */
#tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  display:flex;max-width:540px;margin:0 auto;
  background:rgba(23,28,37,.94);backdrop-filter:blur(12px);
  border-top:1px solid var(--line);padding:6px 4px calc(6px + var(--safe-b));
}
#tabbar button{
  flex:1;background:none;border:0;color:var(--dim);font-size:10.5px;font-weight:700;
  display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 2px;cursor:pointer;position:relative;
}
#tabbar button .ico{font-size:19px;line-height:1}
#tabbar button.on{color:var(--good)}
#tabbar button .dot{
  position:absolute;top:3px;right:calc(50% - 16px);width:7px;height:7px;border-radius:99px;
  background:var(--bad);display:none;
}
#tabbar button.alert .dot{display:block}

/* ---------- modal ---------- */
#modal-root:empty{display:none}
.backdrop{
  position:fixed;inset:0;background:rgba(8,11,15,.72);z-index:50;
  display:flex;align-items:flex-end;justify-content:center;padding:0;
  animation:fade .16s ease;
}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{
  width:100%;max-width:540px;background:var(--panel);border:1px solid var(--line);
  border-radius:18px 18px 0 0;padding:16px 14px calc(18px + var(--safe-b));
  max-height:90dvh;overflow-y:auto;animation:up .22s cubic-bezier(.2,.9,.3,1);box-shadow:var(--shadow);
}
@keyframes up{from{transform:translateY(24px)}to{transform:translateY(0)}}
.sheet h3{margin:0 0 3px;font-size:17px}
.sheet .sheetsub{margin:0 0 14px;font-size:13px;color:var(--dim)}
.sheet .actions{display:flex;gap:9px;margin-top:14px}
.sheet .actions .btn{flex:1}

/* ---------- toast ---------- */
#toast-root{position:fixed;left:0;right:0;bottom:calc(86px + var(--safe-b));z-index:60;pointer-events:none;
  display:flex;flex-direction:column;align-items:center;gap:7px}
.toast{
  background:rgba(30,44,39,.97);border:1px solid #3f6d58;color:#dfffee;
  padding:9px 15px;border-radius:999px;font-size:13px;font-weight:600;box-shadow:var(--shadow);
  animation:toastin .25s ease, toastout .3s ease 2.3s forwards;max-width:92vw;text-align:center;
}
.toast.bad{background:rgba(58,26,26,.97);border-color:#7a3f3f;color:#ffdcd9}
.toast.coin{background:rgba(56,45,20,.97);border-color:#7a663f;color:#ffeec2}
@keyframes toastin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes toastout{to{opacity:0;transform:translateY(-6px)}}

/* ---------- onboarding ---------- */
.ob{padding:20px 14px calc(30px + var(--safe-b));max-width:540px;margin:0 auto}
.ob h1{font-size:25px;margin:0 0 6px;letter-spacing:-.4px}
.ob .lede{color:var(--dim);font-size:14px;margin:0 0 20px;line-height:1.55}
.pickgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
.pick{
  background:var(--panel);border:2px solid var(--line);border-radius:var(--r);padding:10px;
  cursor:pointer;text-align:center;transition:.14s;
}
.pick.on{border-color:var(--good);background:#1c2620}
.pick img{width:100%;max-width:104px;display:block;margin:0 auto;border-radius:10px}
.pick b{display:block;font-size:13.5px;margin-top:5px}
.pick span{display:block;font-size:11px;color:var(--dim);line-height:1.35;margin-top:2px}
.steps{display:flex;gap:5px;margin-bottom:16px}
.steps u{flex:1;height:3px;border-radius:9px;background:var(--line)}
.steps u.on{background:var(--good)}

.empty{text-align:center;padding:26px 14px;color:var(--dim)}
.empty .big{font-size:34px;margin-bottom:8px}
.empty p{margin:0 0 14px;font-size:13.5px;line-height:1.55}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important}
}
