<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- The UI builds screens with innerHTML, so lock down what the page is allowed to execute
     and reach. Any future injection bug becomes inert rather than exploitable.
     img-src needs data: for the procedurally generated pet portraits; style-src needs
     unsafe-inline for the inline style attributes in the rendered markup. -->
<!-- frame-ancestors is deliberately absent: it is ignored in a meta tag and only works as an
     HTTP header. If this is ever hosted rather than opened locally, set it there. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; manifest-src 'self'; form-action 'none'; base-uri 'none'">
<!-- No user-scalable=no: blocking pinch-zoom locks out anyone who needs to magnify text. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14181f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="A debt payoff tracker with a Tamagotchi attached.">
<title>Zeroling</title>
<link rel="stylesheet" href="css/style.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
</head>
<body>
<div id="app">
  <header id="topbar"></header>
  <main id="screen"></main>
  <nav id="tabbar"></nav>
</div>
<div id="modal-root"></div>
<div id="toast-root"></div>

<script src="js/data.js"></script>
<script src="js/finance.js"></script>
<script src="js/art.js"></script>
<script src="js/state.js"></script>
<script src="js/game.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
